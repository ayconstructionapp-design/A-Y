      <label class="f">Description<textarea class="in" id="ta-d" rows="2" placeholder="e.g. 18V, 2 batteries, charger, case">${esc(t ? t.description || '' : (cur.tdraft || {}).d || '')}</textarea></label>
      <label class="f">Serial number<input class="in" id="ta-s" required placeholder="e.g. MK458921" value="${esc(t ? t.serial || '' : (cur.tdraft || {}).s || '')}" style="font-family:var(--mono)"></label>
      <button class="btn">${t ? 'Save' : 'Add to main store'}</button></form>
    ${t ? '' : '<p class="hint">After adding, hand the tool over to a site manager from the main store. That creates the signed handover document.</p>'}</main>`;

/* handover: choose who gives, who receives and which tools, then both sign */
const HO = {
  to_manager:{title:'Hand over to a site manager', giver:'Issued by (admin)', recv:'Received by (site manager)'},
  to_brigadier:{title:'Issue tools to a brigadier', giver:'Issued by (site manager)', recv:'Received by (brigadier)'},
  return:{title:'Return tools from a brigadier', giver:'Returned by (brigadier)', recv:'Received by (site manager)'},
  to_store:{title:'Return tools to the main store', giver:'Returned by (site manager)', recv:'Received by (admin)'},
};
function hoOptions(ho){
  const busy = busyTools(), sid = ho.siteId || null;
  const at = L.tools.filter(t => !t.kitOf && (t.siteId || null) === sid && !busy.has(t.id));
  let givers = [], recvs = [], tools = [];
  if (ho.kind === 'to_manager') {
    givers = admins().sort(byName); recvs = sid ? managersOf(sid) : [];
    if (!recvs.length) recvs = L.people.filter(p => p.role === 'manager').sort(byName);
    tools = L.tools.filter(t => !t.kitOf && !t.siteId && t.status === 'available' && !busy.has(t.id));
  } else if (ho.kind === 'to_brigadier') {
    const hold = new Set(at.filter(t => t.status === 'available' && t.holderRole !== 'brigadier').map(t => t.holderId));
    givers = [...new Set([...managersOf(sid).map(p => p.id), ...hold])].map(pById).filter(p => p && p.role !== 'brigadier').sort(byName);
    recvs = brigsOf(sid); tools = at.filter(t => t.status === 'available' && t.holderRole !== 'brigadier' && t.holderId === ho.giverId);
  } else if (ho.kind === 'return') {
    givers = [...new Set(at.filter(t => t.holderRole === 'brigadier').map(t => t.holderId))].map(pById).filter(Boolean).sort(byName);
    recvs = [...managersOf(sid), ...admins()]; tools = at.filter(t => t.holderId === ho.giverId && t.holderRole === 'brigadier' && !['lost'].includes(t.status));
  } else if (ho.kind === 'to_store') {
    givers = [...new Set([...managersOf(sid).map(p => p.id), ...at.filter(t => t.holderRole === 'manager').map(t => t.holderId)])].map(pById).filter(p => p && p.role === 'manager').sort(byName);
    recvs = admins().sort(byName); tools = at.filter(t => t.holderId === ho.giverId && t.holderRole !== 'brigadier' && t.status !== 'lost');
  }
  return {givers, recvs, tools: tools.sort(byName)};
}
VIEWS.ho = () => {
  const ho = cur.ho; if (!ho || !HO[ho.kind]) return VIEWS.tools();
  const o = hoOptions(ho), cfg = HO[ho.kind];
  if (!o.givers.some(p => p.id === ho.giverId)) { ho.giverId = (o.givers.find(p => me && p.id === me.id) || o.givers[0] || {}).id || ''; }
  const o2 = hoOptions(ho);
  if (!o2.recvs.some(p => p.id === ho.recvId)) ho.recvId = (o2.recvs.length === 1 || ho.kind === 'to_store' || ho.kind === 'return' ? ((o2.recvs.find(p => me && p.id === me.id) || o2.recvs[0] || {}).id || '') : '');
  Object.keys(ho.sel).forEach(id => { if (!o2.tools.some(t => t.id === id)) delete ho.sel[id]; });
  const sel = Object.keys(ho.sel).filter(id => ho.sel[id]);
  const pSel = (id, list, val, ph) => `<select class="in" data-c="${id}"><option value="">${ph}</option>${list.map(p => `<option value="${esc(p.id)}" ${val === p.id ? 'selected' : ''}>${esc(personName(p))} – ${esc(roleName(p.role))}</option>`).join('')}</select>`;
  const ok = ho.giverId && ho.recvId && sel.length && ho.giverId !== ho.recvId && (ho.kind !== 'to_manager' || ho.siteId);
  return `<main class="wrap"><p class="eyebrow">Tool handover</p><h2>${esc(cfg.title)}</h2>
    ${ho.kind === 'to_manager' ? `<label class="f">Site the tools go to<select class="in" data-c="siteId"><option value="">Choose a site</option>${[...L.sites].sort(byName).map(s => `<option value="${esc(s.id)}" ${ho.siteId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : `<p class="lead">Site: <b>${esc(siteNm(ho.siteId))}</b></p>`}
    <label class="f">${esc(cfg.giver)}${pSel('giverId', o2.givers, ho.giverId, 'Choose a person')}</label>
    <label class="f">${esc(cfg.recv)}${pSel('recvId', o2.recvs, ho.recvId, 'Choose a person')}</label>
    ${ho.kind === 'to_brigadier' && !o2.recvs.length ? '<p class="err">No brigadier is linked to this site. An admin opens brigadier accounts in Admin → Accounts.</p>' : ''}
    <h3 class="sec">Tools <small>${sel.length} of ${o2.tools.length} chosen</small></h3>
    ${o2.tools.length ? `<div class="stack">${o2.tools.map(t => `<button class="opt tpick ${ho.sel[t.id] ? 'sel' : ''}" role="checkbox" aria-checked="${!!ho.sel[t.id]}" data-a="t-ho-pick" data-id="${esc(t.id)}">${thumbT(t)}<span class="t"><b>${esc(t.name)}</b><small>${esc([t.brand, t.serial ? 'SN ' + t.serial : ''].filter(Boolean).join(' · '))}</small>${SVC_OPEN.includes(t.status) ? `<small>${tPill(t.status)}</small>` : ''}</span><span class="chk"></span></button>`).join('')}</div>
      ${o2.tools.length > 1 ? `<button class="btn ghost sm" style="margin-top:10px" data-a="t-ho-all">${sel.length === o2.tools.length ? 'Clear all' : 'Choose all'}</button>` : ''}`
      : `<div class="empty">${ho.giverId ? 'No tools can be handed over by this person. Tools that need service, or are waiting for another handover or transfer, cannot be issued.' : 'Choose who gives the tools first.'}</div>`}
  </main>${footer(`<button class="btn" data-a="t-ho-create" ${ok ? '' : 'disabled'}>Continue to signatures</button>`)}`;
};
VIEWS.hosign = () => {
  const h = L.handovers.find(x => x.id === cur.hid) || (cur.hlocal && cur.hlocal.id === cur.hid ? cur.hlocal : null);
  if (!h) return `<main class="wrap"><div class="empty">Loading…</div></main>`;
  const g = h.sigs || {}, done = h.status === 'done', cfg = HO[h.kind] || HO.to_manager;
  const tools = (h.tools || []).map(x => ({...x, ...(L.tools.find(t => t.id === x.id) || {}), name:x.name, brand:x.brand, serial:x.serial, description:x.description, kit:x.kit || []}));
  const row = (k, lbl, nm) => { const x = g[k];
    return `<div class="sigrow ${x ? 'done' : ''}"><div class="sigt"><small>${esc(lbl)}</small><b>${esc(x ? x.name : nm)}</b>${x ? `<span class="when">Signed ${esc(fmtDate(x.at))}</span>` : ''}</div>
      ${x ? `<img class="sigimg" src="${x.img}" alt="Signature of ${esc(x.name)}">` : ''}${done || h.status === 'cancelled' ? '' : `<button class="btn sm ${x ? 'ghost' : 'dark'}" data-a="t-sign" data-k="${k}">${x ? 'Sign again' : 'Sign'}</button>`}</div>`; };
  return `<main class="wrap"><p class="eyebrow">${esc(hoKindLbl(h))}</p><h2>Tool handover ${esc(h.no)}</h2>
    ${done ? `<div class="banner ok"><b>Handover complete.</b> ${esc(h.toName)} is now responsible for ${tools.length === 1 ? 'this tool' : 'these tools'}. The signed PDF is saved.</div>` : h.status === 'cancelled' ? '<div class="banner bad"><b>Cancelled.</b> The tools did not change hands.</div>' : ''}
    <dl class="facts">
      <dt>Construction site</dt><dd>${esc(siteNm(h.siteId))}</dd><dt>Date of handover</dt><dd>${esc(fmtDate(h.doneAt || h.createdAt))}</dd>
      <dt>${esc(cfg.giver)}</dt><dd>${esc(h.fromName)}</dd><dt>${esc(cfg.recv)}</dt><dd>${esc(h.toName)}</dd></dl>
    <h3 class="sec">Tools <small>${tools.length}</small></h3>
    <div class="stack">${tools.map(t => `<div class="arow">${thumbT(t)}<span class="t"><b>${esc(t.name)}</b><small>${esc(t.brand || '')}${t.serial ? ' · SN ' + esc(t.serial) : ''}</small>${t.description ? `<small>${esc(t.description)}</small>` : ''}${(t.kit || []).length ? `<small class="kitl">Set: <span>${esc(t.kit.map(k => k.name + (k.serial ? ' (SN ' + k.serial + ')' : '')).join(' + '))}</span></small>` : ''}</span></div>`).join('')}</div>
    <div class="sigs"><h3>Signatures</h3>
      ${done ? '' : '<p class="hint" style="margin-top:0">Both people sign on this screen. When the second signature is saved, the PDF is created and stored automatically.</p>'}
      ${row('giver', cfg.giver, h.fromName)}${row('receiver', cfg.recv, h.toName)}
      ${done ? `<button class="btn" data-a="t-pdf" data-id="${esc(h.id)}">${I.pdf} View PDF</button><p class="hint">Saved as “${esc(h.pdfName || '')}”</p>` : ''}
      ${cur.hbusy ? '<p class="hint"><b>Creating the PDF…</b></p>' : ''}
    </div>
    ${!done && h.status === 'open' ? `<button class="btn ghost danger" data-a="t-ho-cancel" style="margin-top:12px">${armed === 'hoc:' + h.id ? 'Tap again to cancel the handover' : 'Cancel this handover'}</button>` : ''}
  </main>`;
};

/* brigadier home: the tools I am responsible for */

    ${sleepBtn()}
    ${waiting.length ? `<h3 class="sec">Waiting for signatures <small>${waiting.length}</small></h3><div class="stack">${waiting.map(hoRow).join('')}</div>` : ''}
    ${mine.length ? `<div class="stack">${mine.map(t => { const open = SVC_OPEN.includes(t.status);
      return `<div class="mtc"><button class="mtp" data-a="t-open" data-id="${esc(t.id)}">${t.photo ? `<img src="${esc(t.photo)}" alt="">` : I.tool}</button>

          <dl><dt>Brand</dt><dd>${esc(t.brand || '—')}</dd><dt>Serial number</dt><dd class="mono">${esc(t.serial || '—')}</dd>${(t.kit || []).length ? `<dt>Set</dt><dd>${kitParts(t).map(k => `<span class="kitp">${esc(k.name)}<br><span class="mono">SN ${esc(k.serial || '—')}</span></span>`).join('')}</dd>` : ''}<dt>Received</dt><dd>${esc(fmtDay(t.since))}</dd><dt>Construction site</dt><dd>${esc(siteNm(t.siteId))}</dd></dl>
          ${t.description ? `<p class="mtd">${esc(t.description)}</p>` : ''}

    <h3 class="sec">My handover documents <small>${docs.length}</small></h3>

  </main>`;

/* transfer between sites: site managers ask, the admin approves */
VIEWS.transfer = () => {
  const sid = tSid(cur.tsite), x = cur.trf; if (!sid || !x) return VIEWS.tools();
  const busy = busyTools();
  const tools = L.tools.filter(t => !t.kitOf && t.siteId === sid && t.holderRole !== 'brigadier' && t.status === 'available' && !busy.has(t.id)).sort(byName);
  Object.keys(x.sel).forEach(id => { if (!tools.some(t => t.id === id)) delete x.sel[id]; });
  const sel = Object.keys(x.sel).filter(id => x.sel[id]);
  const mgrs = x.toSiteId ? managersOf(x.toSiteId) : [];
  if (isAdmin && x.toSiteId && !mgrs.some(p => p.id === x.newHolderId)) x.newHolderId = (mgrs[0] || {}).id || '';
  const ok = x.toSiteId && sel.length && (!isAdmin || x.newHolderId);
  return `<main class="wrap"><p class="eyebrow">Tool transfer</p><h2>From ${esc(siteNm(sid))}</h2>
    <p class="lead">${isAdmin ? 'You approve this transfer yourself.' : 'The admin must approve the transfer. Until then the tools stay on this site.'} Tools with a brigadier must be returned first. Tools that need service cannot be transferred.</p>
    <label class="f">Transfer to site<select class="in" data-c="trf-to"><option value="">Choose a site</option>${[...L.sites].filter(s => s.id !== sid).sort(byName).map(s => `<option value="${esc(s.id)}" ${x.toSiteId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    ${isAdmin && x.toSiteId ? `<label class="f">Responsible site manager at the new site<select class="in" data-c="trf-holder">${mgrs.map(p => `<option value="${esc(p.id)}" ${x.newHolderId === p.id ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select></label>${mgrs.length ? '' : '<p class="err">No site manager is linked to that site.</p>'}` : ''}
    <label class="f">Note (optional)<input class="in" id="trf-note" value="${esc(x.note || '')}" data-trfnote></label>
    <h3 class="sec">Tools <small>${sel.length} of ${tools.length} chosen</small></h3>
    ${tools.length ? `<div class="stack">${tools.map(t => `<button class="opt tpick ${x.sel[t.id] ? 'sel' : ''}" role="checkbox" aria-checked="${!!x.sel[t.id]}" data-a="t-trf-pick" data-id="${esc(t.id)}">${thumbT(t)}<span class="t"><b>${esc(t.name)}</b><small>${esc([t.brand, t.serial ? 'SN ' + t.serial : ''].filter(Boolean).join(' · '))} · <span>${esc(holderLine(t))}</span></small></span><span class="chk"></span></button>`).join('')}</div>` : '<div class="empty">No tools on this site can be transferred right now.</div>'}
  </main>${footer(`<button class="btn" data-a="t-trf-send" ${ok ? '' : 'disabled'}>${isAdmin ? 'Transfer now' : 'Send to admin for approval'}</button>`)}`;
};

/* admin: which tools belong to a set (e.g. drill + battery + charger) */
VIEWS.kit = () => {
  const t = L.tools.find(x => x.id === cur.tool); if (!t || !isAdmin) return VIEWS.tools();
  const busy = busyTools(), q = (cur.kq || '').toLowerCase().trim();
  const cand = L.tools.filter(x => x.id !== t.id && !x.kitOf && !(x.kit || []).length && (x.siteId || null) === (t.siteId || null) && (x.holderId || null) === (t.holderId || null)
    && !['lost', 'out_of_service'].includes(x.status) && !busy.has(x.id) && (!q || [x.name, x.serial, x.brand].some(v => (v || '').toLowerCase().includes(q)))).sort((a, b) => byName(a, b) || String(a.serial).localeCompare(String(b.serial), undefined, {numeric:true}));

/* ---------- tracking: one status per supplier inside an order ---------- */
/* steps: 1 submitted · 2 received by procurement · 3 processing · 4 confirmed with supplier · 5 on the way · 6 delivered to site */
const OSTEPS = [['approved', 'Order Submitted', 'Site Manager / Admin'], ['received', 'Received by Procurement', 'Procurement'], ['processing', 'Processing Order', 'Procurement'],
  ['confirmed', 'Order Confirmed with Supplier', 'Procurement'], ['ontheway', 'Delivery on the Way', 'Procurement'], ['delivered', 'Delivered to Site', 'Site Manager']];
const ORANK = Object.fromEntries(OSTEPS.map(([k], i) => [k, i]));
/* every supplier of the order with its current state */
function oTrack(o){
  const saved = Array.isArray(o.track) ? o.track : [];
  return oGroups(o.items).map(([sup]) => {
    const t = saved.find(x => x.sup === sup);
    if (t) return t;
    const s = o.status === 'delivered' ? 'delivered' : ORANK[o.status] != null ? o.status : 'approved';
    return {sup, s};
  });
}
/* overall stage = the step every supplier has reached */
function oStage(o){
  if (OCLOSED.includes(o.status)) return o.status;
  if (o.status === 'approved') return 'approved';
  const tr_ = oTrack(o); if (!tr_.length) return o.status;
  return OSTEPS[Math.min(...tr_.map(t => ORANK[t.s] ?? 1))][0];
}
const oStageLbl = o => OSTATUS[oStage(o)] || o.status;
function oProgressNote(o){
  if (OCLOSED.includes(o.status) || o.status === 'approved') return '';

/* one shared counter per kind of number (orders, delivery notes) */
async function nextCounter(path, min){
  if (db.serial) return db.serial(min, path);
  const ref = db.doc(path), holder = 'h' + Math.random().toString(36).slice(2);
  for (let i = 0; i < 25; i++) {
    let r = {acquired:true};
    try { r = await ref.acquire({holder, ttlMs:8000}); } catch(_) {}
    if (r.acquired) { const s = await ref.get(); const n = Math.max(min, s.exists ? (+s.data().last || 0) : 0) + 1; await ref.set({last:n, updatedAt:Date.now()}); return n; }

  }

async function compressMat(file){
  for (const [max, q] of [[1000, .72], [850, .65], [700, .6]]) { const r = await compress(file, max, q); if (r.url.length < 160000) return r; }
  return compress(file, 600, .55);
}
/* document pages: as sharp as possible while each page fits in one stored record */
async function compressDoc(file){
  for (const [max, q] of [[1600, .62], [1400, .55], [1200, .5], [1000, .45], [850, .4]]) {
    const r = await compress(file, max, q);
    if (r.url.length < 230000) return r;
  }
  return compress(file, 700, .35);
}
function compress(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res({url:c.toDataURL('image/jpeg', q), w:c.width, h:c.height});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ---------- site history: every movement, oldest first, with a running balance per material ---------- */
function siteHistory(siteId){
  const rows = [], mats = Object.fromEntries(L.materials.map(m => [m.id, m]));
  const site = L.sites.find(x => x.id === siteId) || {};
  const push = (at, type, matId, qty, extra) => { if (!qty || !matId) return; const m = mats[matId] || {};
    rows.push({at:at || 0, type, matId, name:m.name || extra.name || 'Material', brand:m.brand || extra.brand || '', system:m.system || '', code:m.code || '', qty, no:'', from:'', to:'', by:'', note:'', ...extra, name:m.name || extra.name || 'Material'}); };
  const logs = L.stocklog.filter(x => x.siteId === siteId).sort((a, b) => (a.at || 0) - (b.at || 0));
  if (logs.length) logs.forEach(lg => { for (const [m, c] of Object.entries(lg.changes || {})) push(lg.at, lg.initial ? 'Initial stock' : 'Stock correction', m, (c.to || 0) - (c.from || 0), {ev:'log:' + lg.id, to:site.name, by:lg.by ? whoName(lg.by) : '', note:lg.initial ? 'Starting stock entered' : `Changed from ${c.from} to ${c.to} pcs`}); });
  else { const st = L.stock.find(x => x.id === siteId); if (st) for (const [m, q] of Object.entries(st.items || {})) push(st.updatedAt || 0, 'Initial stock', m, +q, {ev:'init:' + siteId, to:site.name, note:'Starting stock entered'}); }
  for (const d of L.deliveries) {
    const ap = L.apMap[d.id]; if (!ap || ap.status !== 'approved') continue;
    const rc = L.receipts[d.id];
    const base = {no:d.no || '', from:d.from || '', to:(d.to && (d.to.name || d.to.address)) || ''};
    if (d.fromKind === 'site' && d.fromId === siteId) for (const it of (d.items || [])) push(ap.at, d.to.kind === 'warehouse' ? 'Returned to owner' : d.to.kind === 'site' ? 'Transferred out' : 'Sent out', it.matId, -it.qty, {...base, ev:'d:' + d.id + ':out', name:it.name, brand:it.brand, by:whoName(ap.by), note:ap.auto ? 'Confirmed by sender' : 'Approved by admin'});
    if (d.to && d.to.kind === 'site' && d.to.id === siteId) for (const it of (d.items || [])) {
      const type = isIncoming(d) ? 'New from supplier' : d.fromKind === 'warehouse' ? 'From owner warehouse' : 'Received from site';
      const line = rc && (rc.items || []).find(x => x.matId === it.matId);
      if (line) push(rc.at, type, it.matId, line.received, {...base, ev:'d:' + d.id + ':in', name:it.name, brand:it.brand, by:whoName(rc.by), note:(d.extNo ? `Supplier note ${d.extNo}. ` : '') + (line.received !== line.sent ? `Note said ${line.sent}, counted ${line.received}` : 'Counted, matches note')});
      else push(ap.at, type + ' (not checked)', it.matId, it.qty, {...base, ev:'d:' + d.id + ':in', name:it.name, brand:it.brand, by:whoName(ap.by), note:'Not counted on arrival yet'});
    }
    if (rc && rc.resolve && !isIncoming(d)) for (const [m, res] of Object.entries(rc.resolve)) if (res.target === 'site:' + siteId) {
      const line = (rc.items || []).find(x => x.matId === m);
      if (line) push(res.at, 'Lost material assigned', m, line.sent - line.received, {...base, ev:'lost:' + d.id + ':' + res.at, by:whoName(res.by), note:res.note || 'Assigned by admin'});
    }
  }
  rows.sort((a, b) => a.at - b.at);
  const bal = {}; rows.forEach(r => { bal[r.matId] = (bal[r.matId] || 0) + r.qty; r.balance = bal[r.matId]; });
  return rows;
}

/* movement matrix: one row per material, one column per movement (like the paper site-history sheet) */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDate = t => { const d = new Date(t); return `${pad(d.getDate())}-${MON[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; };
function siteMatrix(siteId){
  const hist = siteHistory(siteId), st = siteStock()[siteId] || {};
  const KIND = t => /^Initial/.test(t) ? ['init', 'Initial stock'] : /^(New from supplier|From owner warehouse)/.test(t) ? ['del', 'Delivery'] : /^Received from site/.test(t) ? ['tin', 'Transfer in'] :
    /^Transferred out/.test(t) ? ['tout', 'Transfer out'] : /^Returned/.test(t) ? ['ret', 'Return'] : /^Sent out/.test(t) ? ['out', 'Sent out'] : /^Stock correction/.test(t) ? ['cor', 'Correction'] : /^Lost/.test(t) ? ['lost', 'Lost found'] : ['oth', 'Movement'];
  const cols = [], byEv = {}, counters = {};
  for (const r of hist) {
    let c = byEv[r.ev];
    if (!c) {
      const [k, base] = KIND(r.type); counters[k] = (counters[k] || 0) + 1;
      c = byEv[r.ev] = {ev:r.ev, at:r.at, kind:k, label:k === 'init' ? base : `${base} ${counters[k]}`, no:r.no || '', other:r.qty > 0 ? r.from : r.to, unchecked:/not checked/.test(r.type), cells:{}};
      cols.push(c);
    }
    c.cells[r.matId] = (c.cells[r.matId] || 0) + r.qty;
  }
  const mats = Object.fromEntries(L.materials.map(m => [m.id, m]));
  const ids = [...new Set([...hist.map(r => r.matId), ...Object.keys(st).filter(k => st[k])])];
  const catName = m => `${brandName(m.brand) || 'Other'} · ${sysName(m.system) || ''}`.trim();
  const cats = [...new Set(ids.map(id => catName(mats[id] || {})))].sort();
  const rows = ids.map(id => { const m = mats[id] || {name:(hist.find(r => r.matId === id) || {}).name || 'Removed material'}; return {id, cat:catName(m), catNo:cats.indexOf(catName(m)) + 1, name:m.name, code:m.code || '', onSite:st[id] || 0}; })
    .sort((a, b) => a.catNo - b.catNo || a.name.localeCompare(b.name, undefined, {numeric:true})).map((r, i) => ({...r, no:i + 1}));
  return {cols, rows};
}
const cellTxt = q => !q ? '-' : q > 0 ? String(q) : `(${-q})`;

function buildReportPdf(site){
  const {jsPDF} = window.jspdf;
  const doc = trPdf(new jsPDF({unit:'mm', format:'a3', orientation:'landscape'}));
  const W = 420, H = 297, M = 8;
  const {cols, rows} = siteMatrix(site.id);
  const grey = [217, 217, 217], cyan = [198, 245, 243], yellow = [255, 247, 153], blue = [0, 0, 230], red = [230, 0, 0], line = [110, 110, 110];
  // fixed columns, then up to N movement columns per page (more movements continue on the next page)
  const fixed = [{t:'No.', w:9, c:1}, {t:'Cat\nNo.', w:9, c:1}, {t:'Category', w:52}, {t:'Item', w:84}, {t:'Part No.', w:24}, {t:'On Job\nSite', w:18, c:1, y:1}];
  const baseFixed = fixed.map(c => c.w), mw = 16.5;
  let fixedW = baseFixed.reduce((a, b) => a + b, 0);
  const perPage = Math.max(1, Math.floor((W - 2 * M - fixedW) / mw));

    doc.text(brandName(it.brand), x + 2, y + 6); x += cols[3].w;
    doc.text(it.system === 'slab' ? 'Slab' : (it.system === 'wall' ? 'Wall' : ''), x + 2, y + 6); x += cols[4].w;
    doc.setFont('helvetica', 'bold'); doc.text(`${it.qty} pcs`, x + cols[5].w - 2, y + 6, {align:'right'}); x += cols[5].w;
    const line = rc && (rc.items || []).find(z => z.key === it.key);
    if (line) { if (line.received !== line.sent) doc.setTextColor(179, 38, 30); else doc.setTextColor(30, 122, 75);
      doc.text(`${line.received} pcs ${line.received === line.sent ? 'OK' : 'X'}`, x + cols[6].w - 2, y + 6, {align:'right'}); ink(); }
    else { doc.setFont('helvetica', 'normal'); mute(); doc.text('-', x + cols[6].w - 2, y + 6, {align:'right'}); ink(); }
    y += rh; doc.setDrawColor(205, 211, 218); doc.line(M, y, W - M, y);
  });
  const pcs = (r.items || []).reduce((s, i) => s + (+i.qty || 0), 0);
  y += 7; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); ink();
  doc.text(`Total: ${(r.items || []).length} items`, M + 2, y); doc.text(`${pcs} pcs`, W - M - 2 - cols[6].w, y, {align:'right'});
  if (rc) doc.text(`${(rc.items || []).reduce((a, i) => a + i.received, 0)} pcs`, W - M - 2, y, {align:'right'});
  y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); mute();
  if (rc) {
    const diffs = (rc.items || []).filter(i => i.received !== i.sent);
    doc.text(`Received and checked by ${whoName(rc.by)} at ${r.to.name || ''} · ${fmtDate(rc.at)}`, M + 2, y); y += 5;
    diffs.forEach(i => { doc.setTextColor(179, 38, 30); doc.text(`Difference: ${i.name} — sent ${i.sent}, received ${i.received} (${i.sent - i.received > 0 ? (i.sent - i.received) + ' missing' : (i.received - i.sent) + ' extra'}). Recorded as lost material until an admin resolves it.`, M + 2, y, {maxWidth:W - 2 * M - 4}); y += 9; });
    ink();
  } else if (r.to && r.to.kind === 'site') { doc.text('Received column: filled in by the receiving site when the truck is unloaded.', M + 2, y); y += 5; }
  y += 5;

  const photos = (r.photos || []).filter(Boolean);
  if (photos.length) {
    if (y > H - 80) { doc.addPage(); y = 16; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Truck photos', M, y); y += 5;
    const pw = (W - 2 * M - 6) / 2;
    for (let i = 0; i < photos.length; i += 2) {
      const pair = photos.slice(i, i + 2);
      const hs = pair.map(p => Math.min(pw * p.h / p.w, 95));
      const rowH = Math.max(...hs);
      if (y + rowH > H - 18) { doc.addPage(); y = 16; }
      pair.forEach((p, j) => { const w = hs[j] * p.w / p.h; try { doc.addImage(p.url, 'JPEG', M + j * (pw + 6), y, w, hs[j]); } catch(_){} });
      y += rowH + 6;
    }
  }
  const npages = isIncoming(r) ? (notePagesCache[r.id] || []) : [];
  const aph = (rc && rc.photos) || [];
  if (aph.length) {
    if (y > H - 80) { doc.addPage(); y = 16; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); ink(); doc.text(`Photos on arrival at ${r.to.name || ''}`, M, y); y += 5;
    const pw2 = (W - 2 * M - 12) / 3;
    const hs2 = aph.map(p => Math.min(pw2 * p.h / p.w, 70)); const rowH2 = Math.max(...hs2);
    if (y + rowH2 > H - 18) { doc.addPage(); y = 16; }
    aph.forEach((p, j) => { try { doc.addImage(p.url, 'JPEG', M + j * (pw2 + 6), y, hs2[j] * p.w / p.h, hs2[j]); } catch(_){} });
    y += rowH2 + 6;
  }
  if (y > H - 52) { doc.addPage(); y = 20; }
  { const g = (db && sigCache[r.id]) || {}; const bw = (W - 2 * M - 12) / 3;
    const boxes = [['sender', 'Site manager (sender)', r.person], ['driver', 'Driver', r.driver], ['receiver', 'Receiver', '']];
    y += 6;
    boxes.forEach(([k, lbl, nm], i) => {
      const x = M + i * (bw + 6), sg = g[k];
      if (sg && sg.img) { const ih = 18, iw = Math.min(bw - 2, ih * (sg.w || 3) / (sg.h || 1)); try { doc.addImage(sg.img, 'PNG', x + 1, y, iw, Math.min(ih, iw * (sg.h || 1) / (sg.w || 3))); } catch(_){} }
      doc.setDrawColor(21, 24, 27); doc.line(x, y + 20, x + bw, y + 20);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); ink(); doc.text(lbl, x, y + 25);
      doc.setFont('helvetica', 'normal'); mute(); doc.text(sg ? sg.name : (nm || 'Name'), x, y + 29.5, {maxWidth:bw});
      doc.text(sg ? 'Signed ' + fmtDate(sg.at) : 'Date and signature', x, y + 34, {maxWidth:bw});
    });
    y += 38; }

  npages.forEach((pg, i) => {
    doc.addPage(); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); ink();
    doc.text(`Supplier's delivery note · page ${i + 1} of ${npages.length}`, M, 14);
    const mw = W - 2 * M, mh = H - 34; let w = mw, h = w * pg.h / pg.w; if (h > mh) { h = mh; w = h * pg.w / pg.h; }
    try { doc.addImage(pg.url, 'JPEG', M + (mw - w) / 2, 20, w, h); } catch(_){}
  });
  const n = doc.getNumberOfPages(), cnt = n - firstPage + 1;
  for (let p = firstPage; p <= n; p++) { doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); mute(); doc.text(`${r.no}${opt.copy ? ' · ' + opt.copy.split(' · ')[0].toLowerCase() : ''} · page ${p - firstPage + 1} of ${cnt}`, W - M, H - 8, {align:'right'}); }
  return doc;
}

render();
})();
</script>

/* app-icon look: photo fills a rounded square, like a phone home-screen icon */
.mtile .ic{background:#fff!important;border-radius:22%!important;border:0!important}
.mtile .ic img{inset:0!important;width:100%!important;height:100%!important;padding:4%;box-sizing:border-box;object-fit:contain;border-radius:22%;background:#fff}
.mtile.on .ic{outline:3px solid var(--accent)!important;outline-offset:-3px}
</style>
<style>
.holdrow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.holdrow:active{background:var(--accent-soft)}
#holdprev{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:rgba(0,0,0,.82);touch-action:none;pointer-events:none}
#holdprev img{max-width:100%;max-height:78vh;object-fit:contain;background:#fff;border-radius:12px}
#holdprev p{margin:0;color:#fff;font:600 18px/1.25 var(--body);text-align:center}
</style>
<script>
(function(){
  let timer = null, shown = false, sx = 0, sy = 0, row = null;
  const DELAY = 300;
  function show(id){
    const info = window.__holdInfo ? window.__holdInfo(id) : null; if (!info || !info.src) return; const src = info.src;
    const o = document.createElement('div'); o.id = 'holdprev';
    const im = document.createElement('img'); im.src = src; im.alt = '';
    const p = document.createElement('p'); p.textContent = info.name;
    o.append(im, p); document.body.appendChild(o); shown = true;
    try { navigator.vibrate && navigator.vibrate(15); } catch(_){}
  }
  function hide(){ clearTimeout(timer); timer = null; row = null; if (shown) { const o = document.getElementById('holdprev'); if (o) o.remove(); shown = false; } }
  function start(el, x, y){ hide(); row = el; sx = x; sy = y; const id = el.dataset.hold; timer = setTimeout(() => { show(id); }, DELAY); }
  const find = t => t && t.closest ? t.closest('[data-hold]') : null;
  document.addEventListener('touchstart', e => { const el = find(e.target); if (el && e.touches.length === 1) start(el, e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (shown) { e.preventDefault(); return; }
    if (timer && e.touches[0] && Math.hypot(e.touches[0].clientX - sx, e.touches[0].clientY - sy) > 10) hide();
  }, {passive:false});
  ['touchend','touchcancel'].forEach(t => document.addEventListener(t, hide, {passive:true}));
  document.addEventListener('mousedown', e => { const el = find(e.target); if (el && e.button === 0) start(el, e.clientX, e.clientY); });
  ['mouseup','mouseleave','blur'].forEach(t => addEventListener(t, hide));
  document.addEventListener('contextmenu', e => { if (find(e.target)) e.preventDefault(); });
  document.addEventListener('scroll', () => { if (!shown) hide(); }, true);
})();
</script>
</body></html>
