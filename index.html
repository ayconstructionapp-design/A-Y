<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.json">

</head><body>
<title>Formwork Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one narrow column built for a phone in a gloved hand — sticky step bar on top, big action bar fixed at the bottom. */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --sunk:#F3F5F7; --ink:#15181B; --muted:#58616B; --line:#CDD3DA;
  --accent:#F2B705; --on-accent:#15181B; --accent-soft:#FFF3C4;
  --ok:#1E7A4B; --danger:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1B1E22; --sunk:#16191C; --ink:#ECEFF2; --muted:#9AA3AD; --line:#30363D;
  --accent:#FFC629; --on-accent:#111315; --accent-soft:#3A3014; --ok:#4CC38A; --danger:#FF7A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1B1E22; --sunk:#16191C; --ink:#ECEFF2; --muted:#9AA3AD; --line:#30363D;
  --accent:#FFC629; --on-accent:#111315; --accent-soft:#3A3014; --ok:#4CC38A; --danger:#FF7A70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 128px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px}
.bar h1{font:700 22px/1.1 var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn.bell{position:relative}
.ncard{border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ncard.n-ok{border-left-color:var(--ok)}.ncard.n-bad,.ncard.n-lost{border-left-color:var(--danger)}.ncard.n-in{border-left-color:#2e7dd7}
.ncard .nmain{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px;background:none;border:0;text-align:left;color:inherit}
.ncard .nic{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:grid;place-items:center}.ncard .nic svg{width:22px;height:22px}
.ncard .nt b{display:block;font-size:16px;line-height:1.25}.ncard .nt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.ncard .when{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.ncard .nseen{display:block;width:100%;padding:10px;border:0;border-top:1px solid var(--line);background:var(--sunk);font-weight:600;color:var(--ink)}
.main.m4{margin-top:12px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);min-height:84px}
.main.m4 .mi{background:var(--ink);color:var(--surface)}
.newd{color:var(--danger)}
.sigs{margin:18px 0 6px;padding:14px;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface)}
.sigs h3{margin-top:0}
.sigrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sigrow .sigt small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.sigrow .sigt b{display:block;font-size:17px}.sigrow .when{font-size:12px;color:var(--ok)}
.sigrow .sigimg{grid-column:1/-1;grid-row:2;max-width:100%;height:64px;object-fit:contain;object-position:left;background:#fff;border:1px dashed var(--line);border-radius:6px}
.sigrow .btn{grid-column:2;grid-row:1}
.sigs > .btn{margin-top:12px;width:100%}
.sigpad{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:10px}
.sigpad .sp-top{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.sigpad .sp-box{position:relative;flex:1;min-height:200px;background:#fff;border:2px solid var(--ink);border-radius:12px;touch-action:none;overflow:hidden}
.sigpad canvas{position:absolute;inset:0;touch-action:none}
.sigpad .sp-line{position:absolute;left:8%;right:8%;bottom:22%;border-top:2px dashed #b9c0c8;padding-top:4px;font-size:12px;color:#8a939c;pointer-events:none}
.sigpad .sp-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.iconbtn.bell .bdg{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#d32f2f;color:#fff;font:700 11px/19px var(--body);text-align:center;box-shadow:0 0 0 2px var(--ink, #15181B)}
.iconbtn.bell.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.bell.ring svg{animation:none}}
.cntbig{display:inline-block;min-width:30px;padding:0 8px;border-radius:16px;background:#d32f2f;color:#fff;font-size:20px;line-height:30px;text-align:center;vertical-align:middle}
.iconbtn{width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(127,127,127,.25)}
.iconbtn svg{width:26px;height:26px}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--ink) 12px 24px)}
.stages{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 16px 10px}
.stages span{height:5px;border-radius:3px;background:rgba(127,127,127,.35)}
.stages span.done{background:var(--accent)}
.stagelbl{max-width:560px;margin:0 auto;padding:0 16px 10px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.pill{font:600 13px/1 var(--body);padding:8px 12px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit}

/* type */
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2{font:700 30px/1.05 var(--display);margin:0 0 6px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h3{font:700 19px/1.1 var(--display);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:10px}

/* options */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:600;font-size:17px}
.opt .t small{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.opt .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.sel .chk::after{content:"";width:7px;height:12px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.empty{padding:16px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:15px}

/* fields */
.typebox{margin-top:18px;padding:14px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.typebox .eyebrow{margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
label.f + label.f{margin-top:12px}
.in{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label.f + label.f{margin-top:0}
.plate{font:600 22px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.search{position:relative;margin-bottom:12px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 18px;border-radius:var(--r);border:2px solid transparent;font:700 20px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:44px;font-size:16px;width:auto;padding:8px 14px}
.btn svg{width:24px;height:24px;flex:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:528px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot-in .meta{flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.2}
.foot-in .meta b{display:block;color:var(--ink);font:700 20px/1 var(--display)}
.foot-in .btn{flex:1}

/* home */
.mains{display:flex;flex-direction:column;gap:12px}
.main{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:104px;padding:16px;border-radius:14px;border:0;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.main .mi{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;flex:none}
.main .mi svg{width:34px;height:34px}
.main .mt{flex:1;min-width:0}
.main b{display:block;font:700 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.main small{display:block;font-size:14px;margin-top:4px;opacity:.85;line-height:1.3}
.main.m1{background:var(--accent);color:var(--on-accent)}
.main.m1 .mi{background:var(--on-accent);color:var(--accent)}
.main.m2{background:var(--ink);color:var(--bg)}
.main.m2 .mi{background:var(--ok);color:#fff}
.main.m3{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.main.m3 .mi{background:var(--accent-soft);color:var(--ink)}
.mcount{position:absolute;top:10px;right:12px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--danger);color:#fff;font:700 16px/30px var(--mono);text-align:center}
.langs{display:flex;gap:6px;margin:4px 0 16px}.langs button{flex:1;padding:10px 6px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;color:var(--ink)}.langs button.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.dhero{min-height:120px}
.sitechk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.chkrow{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}.chkrow input{width:20px;height:20px;accent-color:var(--ink)}
.dhero2{margin-top:12px;min-height:96px}
.drow{display:grid;gap:10px;margin-top:12px}.drow.three{grid-template-columns:repeat(3,1fr)}
.dcard,.dtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:12px 10px;border-radius:14px;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.dcard{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.dcard.alert{border-color:var(--accent)}.dcard.go{border-color:var(--ink)}.dcard.off{opacity:.6}
.dcard .dic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;margin-bottom:2px}.dcard .dic svg{width:21px;height:21px}
.ic-site{background:var(--accent-soft)}.ic-wait{background:#fde7c8}.ic-cont{background:var(--ink);color:var(--surface)}
.dcard b,.dtile b{font:700 13.5px/1.15 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.dcard .dbig,.dtile .dn{font:700 28px/1 var(--display)}
.dcard small,.dtile small{font-size:12px;line-height:1.25;color:var(--muted)}
.dcard .mcount{top:8px;right:8px;min-width:24px;height:24px;line-height:24px;font-size:13px}
.dtile{border:0;color:#fff;min-height:112px;justify-content:flex-end}
.dtile small{color:rgba(255,255,255,.9)}
.dtile.green{background:#1e7a4b}.dtile.red{background:#c62828}.dtile.orange{background:#ef7d00}
.dhead{margin:20px 0 0}
.dcard .dm2{display:block;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-size:12px;line-height:1.25;color:var(--muted)}
.dcard .dm2 b{display:block;font:700 15px/1.1 var(--display);color:var(--ink);text-transform:none}
.m2box{display:grid;gap:2px;padding:14px 16px;margin-bottom:6px;border-radius:14px;background:var(--ink);color:var(--surface)}
.m2box span{font-size:13px;opacity:.85}.m2box b{font:700 30px/1.1 var(--display)}.m2box small{font-size:12.5px;opacity:.8}
.m2h{font:600 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.m2t{color:var(--ink)}
.fhead{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:14px;color:#fff;margin-bottom:10px}
.fhead b{font:700 26px/1 var(--display);text-transform:uppercase}.fhead span{font-size:14px;opacity:.92}
.fhead.f-received{background:#1e7a4b}.fhead.f-delivered{background:#c62828}.fhead.f-onway{background:#ef7d00}
.lines.tot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px}
.lines.tot > div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lines.tot > div:last-child{border:0}
@media (max-width:360px){.dcard b,.dtile b{font-size:12px}.dcard .dbig,.dtile .dn{font-size:24px}}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;width:100%;padding:22px 20px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.hero .ic{width:64px;height:64px;border-radius:14px;background:var(--on-accent);color:var(--accent);display:grid;place-items:center}
.hero .ic svg{width:38px;height:38px}
.hero b{font:700 34px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.hero span{font-size:15px;opacity:.85}
.resume{margin-top:12px}
.dl{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dlb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dlt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dl .no{font:600 14px/1.3 var(--mono)}
.dl .when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.dl .route{font-size:15px;overflow-wrap:anywhere}
.dl .sub{font-size:13px;color:var(--muted)}
.dir{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.dir svg{width:26px;height:26px}
.dir-out{background:var(--danger);color:var(--surface)}
.dir-in{background:var(--ok);color:var(--surface)}
.dirlbl{font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.dirlbl.lbl-out{color:var(--danger)}.dirlbl.lbl-in{color:var(--ok)}
.folder{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.folder .fi{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;flex:none}
.folder .fi svg{width:26px;height:26px}
.folder .fi.wh{background:var(--sunk);color:var(--muted)}
.folder .t{flex:1;min-width:0}
.folder .t b{display:block;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.folder .t small{display:block;color:var(--muted);font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.who{display:inline-flex;align-items:center;gap:6px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{max-width:420px;margin:0 auto}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:8px 0 0}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.times div{padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.times small{display:block;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.times b{font:600 15px/1.3 var(--mono)}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent);font-size:14px;margin-bottom:14px}

/* brand + system tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:128px;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left}
.tile b{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.tile small{color:var(--muted);font-size:14px}
.tiles.brands{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tiles.brands .tile b{font-size:clamp(16px,5.2vw,30px);white-space:nowrap}
.tile.haslogo{position:relative;padding:6px;justify-content:center;background:#fff}
.tile .blogo{width:100%;height:100%;flex:1;min-height:0;object-fit:contain}
.tile.haslogo > span{position:absolute;left:10px;bottom:6px}
.tile .sw{width:28px;height:28px;border-radius:6px}
.tile:active,.opt:active,.mat:active{transform:scale(.99)}
.tiles.one{grid-template-columns:1fr}
.tile.big{min-height:150px;flex-direction:row;align-items:center}
.tile.big.photo{min-height:190px;align-items:flex-end;background-size:cover;background-position:center;color:#fff;border-color:transparent}
.tile.big.photo small{color:rgba(255,255,255,.9)}
.tile.big svg{width:84px;height:84px;color:var(--muted);flex:none}

/* materials */
.mat{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.thumb{width:68px;height:68px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:40px;height:40px}
.mat .t{min-width:0}
.mat .t b{display:block;font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.mat .t small{display:block;color:var(--muted);font-size:13px}
.badge{font:600 14px/1 var(--mono);padding:7px 9px;border-radius:6px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}

<script>
/* Supabase adapter: gives the app the same db / user / downloads objects it used inside Claude. */
(function () {
  const SUPABASE_URL = 'https://ptvhnipvcmczzwgsnmqz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_liqrVWX75gD7sjtw4sgKGA_D3TcWcbM';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const clean = o => JSON.parse(JSON.stringify(o === undefined ? {} : o));
  const rid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : Math.random().toString(36).slice(2) + Date.now().toString(36));
  const cache = {};      // coll -> Map(id -> data)
  const loaded = {};     // coll -> Promise
  const subs = {};       // coll -> Set(fn)
  const chans = {};      // coll -> realtime channel
  const timers = {};

  async function fetchAll(coll) {
    const m = new Map(); let from = 0;
    for (;;) {
      const { data, error } = await sb.from('docs').select('id,data').eq('coll', coll).order('id').range(from, from + 999);
      if (error) throw error;
      data.forEach(r => m.set(r.id, r.data));
      if (data.length < 1000) break;
      from += 1000;
    }
    return m;
  }
  function notify(coll) { (subs[coll] || new Set()).forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
  function reload(coll) {
    clearTimeout(timers[coll]);
    timers[coll] = setTimeout(async () => {
      try { cache[coll] = await fetchAll(coll); loaded[coll] = Promise.resolve(); notify(coll); } catch (e) { console.error(e); }
    }, 150);
  }
  function ensure(coll) {
    if (!loaded[coll]) loaded[coll] = fetchAll(coll).then(m => { cache[coll] = m; });
    if (!chans[coll]) {
      chans[coll] = sb.channel('c:' + coll).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'coll=eq.' + coll }, () => reload(coll)).subscribe();
    }
    return loaded[coll];
  }
  setInterval(() => Object.keys(subs).forEach(c => subs[c].size && reload(c)), 30000);

  const docSnap = (id, data) => ({ id, exists: data !== undefined, data: () => (data === undefined ? undefined : JSON.parse(JSON.stringify(data))) });
  const getCmp = (a, k) => k.split('.').reduce((o, p) => (o == null ? undefined : o[p]), a);

  function query(coll, st) {
    st = st || { where: [], order: null, lim: null };
    const q = {
      where: (f, op, v) => query(coll, { ...st, where: [...st.where, [f, op, v]] }),
      orderBy: (f, dir) => query(coll, { ...st, order: [f, dir || 'asc'] }),
      limit: n => query(coll, { ...st, lim: n }),
      _run() {
        let rows = [...(cache[coll] || new Map()).entries()].map(([id, d]) => [id, d]);
        st.where.forEach(([f, op, v]) => { rows = rows.filter(([, d]) => {
          const x = getCmp(d, f);
          return op === '==' ? x === v : op === '!=' ? x !== v : op === '<' ? x < v : op === '<=' ? x <= v : op === '>' ? x > v : op === '>=' ? x >= v : op === 'in' ? v.includes(x) : op === 'array-contains' ? Array.isArray(x) && x.includes(v) : true; }); });
        if (st.order) { const [f, dir] = st.order, s = dir === 'desc' ? -1 : 1;
          rows.sort((a, b) => { const x = getCmp(a[1], f), y = getCmp(b[1], f); return x === y ? 0 : x == null ? 1 : y == null ? -1 : (x < y ? -s : s); }); }
        if (st.lim) rows = rows.slice(0, st.lim);
        const docs = rows.map(([id, d]) => docSnap(id, d));
        return { docs, size: docs.length, empty: !docs.length, forEach: f => docs.forEach(f) };
      },
      async get() { await ensure(coll); return q._run(); },
      onSnapshot(cb, err) {
        const fn = () => cb(q._run());
        (subs[coll] = subs[coll] || new Set()).add(fn);
        ensure(coll).then(fn, e => err && err(e));
        return () => subs[coll].delete(fn);
      },
    };
    return q;
  }

  function docRef(coll, id) {
    const local = (data) => { (cache[coll] = cache[coll] || new Map()); if (data === null) cache[coll].delete(id); else cache[coll].set(id, data); notify(coll); };
    const fail = e => { reload(coll); throw e; };
    return {
      id,
      async get() { await ensure(coll); return docSnap(id, cache[coll].get(id)); },
      async set(obj, opts) {
        const data = clean(obj);
        if (opts && opts.merge) { local({ ...((cache[coll] || new Map()).get(id) || {}), ...data });
          const { error } = await sb.rpc('doc_merge', { p_coll: coll, p_id: id, p_patch: data, p_upsert: true }); if (error) fail(error); return; }
        local(data);
        const { error } = await sb.from('docs').upsert({ coll, id, data, updated_at: new Date().toISOString() }); if (error) fail(error);
      },
      async update(obj) {
        const data = clean(obj);
        const cur = (cache[coll] || new Map()).get(id); if (cur) local({ ...cur, ...data });
        const { data: ok, error } = await sb.rpc('doc_merge', { p_coll: coll, p_id: id, p_patch: data, p_upsert: false });
        if (error) fail(error); if (!ok) { reload(coll); throw new Error('No document to update: ' + coll + '/' + id); }
      },
      async delete() {
        local(null);
        const { error } = await sb.from('docs').delete().eq('coll', coll).eq('id', id); if (error) fail(error);
      },
      onSnapshot(cb, err) {
        const fn = () => cb(docSnap(id, (cache[coll] || new Map()).get(id)));
        (subs[coll] = subs[coll] || new Set()).add(fn);
        ensure(coll).then(fn, e => err && err(e));
        return () => subs[coll].delete(fn);
      },
    };
  }

    const q = query(path);
    q.doc = id => { id = id || rid(); if (String(id).includes('/')) { const p = String(id).split('/'); const i = p.pop(); return docRef(path + '/' + p.join('/'), i); } return docRef(path, id); };

  }

    collection,
    doc(path) { const p = path.split('/'); const id = p.pop(); return docRef(p.join('/'), id); },

(async () => {

  if (!db) { dbMissing = true; render(); return; }
  const cat = p => db.collection('catalog/main/' + p);
  const sub = (q, key) => q.onSnapshot(s => { L[key] = s.docs.map(x => ({id:x.id, ...x.data()})); dbReady = true; if (key === 'people') { loaded.people = true; restoreSession(); } refresh(); }, () => {});
  sub(cat('people'), 'people');
  sub(cat('sites'), 'sites');
  sub(cat('warehouses'), 'warehouses');
  sub(cat('companies'), 'companies');
  sub(cat('materials'), 'materials');
  sub(cat('groups'), 'groups');
  sub(cat('sysphotos'), 'sysphotos');
  sub(cat('stock'), 'stock');
  sub(db.collection('stocklog').limit(1000), 'stocklog');
  sub(db.collection('deliveries').orderBy('createdAt', 'desc').limit(500), 'deliveries');
  sub(db.collection('tools').limit(1000), 'tools');
  sub(db.collection('toolevents').orderBy('at', 'desc').limit(1000), 'tevents');
  sub(db.collection('handovers').orderBy('createdAt', 'desc').limit(1000), 'handovers');
  sub(db.collection('services').orderBy('at', 'desc').limit(1000), 'services');
  sub(db.collection('transfers').limit(1000), 'transfers');
  sub(db.collection('tnotes').orderBy('at', 'desc').limit(1000), 'tnotes');
  sub(db.collection('orders').orderBy('createdAt', 'desc').limit(1000), 'orders');
  sub(db.collection('houses').limit(500), 'houses');
  db.collection('approvals').limit(1000).onSnapshot(s => { L.apMap = {}; s.docs.forEach(x => L.apMap[x.id] = x.data()); refresh(); }, () => {});
  db.collection('receipts').limit(1000).onSnapshot(s => { L.receipts = {}; s.docs.forEach(x => L.receipts[x.id] = x.data()); refresh(); }, () => {});

function isTyping(){ const a = document.activeElement; return a && app.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'file'; }
let seenDecided = null;
function checkNewDecisions(){
  if (!me || isAdmin || !dbReady) return;
  const dec = myNotes().filter(d => { const ap = L.apMap[d.id]; return ap && !ap.auto && ap.status !== 'pending'; });
  if (seenDecided) { const nw = dec.filter(d => !seenDecided.has(d.id));
    nw.forEach(d => toast(statusOf(d) === 'approved' ? `Delivery ${d.no} is approved. Open it to print 3 copies.` : `Delivery ${d.no} was cancelled by the admin.`));
    if (nw.length) { try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch(_){} } }
  seenDecided = new Set(dec.map(d => d.id));
}
let seenPending = null;
function checkNewPending(){
  if (!isAdmin || !dbReady) return;
  const ids = pendingList().map(d => d.id);
  if (seenPending) { const nw = L.deliveries.filter(d => ids.includes(d.id) && !seenPending.has(d.id));
    if (nw.length) { toast(nw.length === 1 ? `New delivery note ${nw[0].no} from ${nw[0].person || nw[0].from} waits for approval` : `${nw.length} new delivery notes wait for approval`); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch(_){} } }
  seenPending = new Set(ids);
}

function usage(){
  const c = {};
  for (const d of L.deliveries) for (const it of (d.items || [])) if (it.matId) c[it.matId] = (c[it.matId] || 0) + 1;
  return c;
}
const statusOf = d => !db ? 'approved' : ((L.apMap[d.id] || {}).status || 'pending');  /* no shared store: nothing to approve against */
const STATUS_LBL = {pending:'Waiting for approval', approved:'Approved', rejected:'Cancelled'};
function pillFor(d){ const s = statusOf(d); if (isIncoming(d) && s === 'pending') return '<span class="st st-pending">Waiting for site check</span>'; return `<span class="st st-${s}">${isIncoming(d) && s === 'approved' ? 'From supplier' : STATUS_LBL[s]}</span>${recvPill(d)}`; }
function recvPill(d){
  if (!db || statusOf(d) !== 'approved' || !(d.to && d.to.kind === 'site') || isIncoming(d)) return '';
  const rc = L.receipts[d.id];
  if (!rc) return '<span class="st st-pending">To check</span>';
  return (rc.items || []).some(i => i.received !== i.sent) ? '<span class="st st-rejected">Difference</span>' : '<span class="st st-approved">Received ✓</span>';
}
function lostEntries(){
  const out = [];
  for (const [id, rc] of Object.entries(L.receipts)) {
    const d = L.deliveries.find(x => x.id === id); if (!d || isIncoming(d)) continue;
    for (const i of (rc.items || [])) if (i.received !== i.sent) out.push({d, rc, i, diff:i.sent - i.received, res:(rc.resolve || {})[i.matId]});
  }
  return out.sort((a, b) => (b.rc.at || 0) - (a.rc.at || 0));
}

const notePagesCache = {}; let pageView = null;
async function loadNotePages(id){
  if (!db || notePagesCache[id]) return notePagesCache[id] || [];
  try {
    const snap = await db.collection('notepages').where('deliveryId', '==', id).get();
    notePagesCache[id] = snap.docs.map(x => x.data()).filter(x => x.deliveryId === id).sort((a, b) => a.page - b.page);
  } catch(_) { notePagesCache[id] = []; }
  return notePagesCache[id];
}
function notePagesHtml(rec){

  if (!pages) { loadNotePages(rec.id).then(() => refresh()); return `<div class="empty" style="margin-bottom:14px">Loading the supplier's delivery note…</div>`; }
  return `<h3 style="margin-top:4px">Supplier's delivery note (${pages.length} ${pages.length === 1 ? 'page' : 'pages'})</h3>
    <div class="notepages">${pages.map((p, i) => `<button data-a="view-page" data-id="${esc(rec.id)}" data-i="${i}" aria-label="Open page ${i + 1}"><img src="${p.url}" alt=""><span>Page ${i + 1}</span></button>`).join('')}</div>`;
}

      <b>${esc(e.name)}</b><small>${mem.length ? `${modelCount(mem)} ${e.named ? 'models' : 'sizes'}${onSite ? ' here' : ''}` : 'empty'}</small></button>`;
  }
  const m = e.m, inCart = D.items.find(i => i.matId === m.id), have = fs ? Math.max(0, fs[m.id] || 0) : null;
  return `<button class="mtile ${inCart ? 'on' : ''} ${fs && !have ? 'none' : ''}" data-a="mat" data-id="${esc(m.id)}">
    <span class="ic">${m.photo ? `<img src="${esc(m.photo)}" alt="">` : I[m.system] || ''}${inCart ? `<span class="badge">${inCart.qty}</span>` : ''}${isStar(e) || isAdmin ? `<span class="star ${isStar(e) ? 'on' : ''}" ${isAdmin ? `data-a="star" data-id="${esc(starKey(e))}" role="button" aria-label="${isStar(e) ? 'Remove star' : 'Star to keep at the top'}"` : 'aria-hidden="true"'}>★</span>` : ''}</span>
    <b>${esc(m.name)}</b><small>${fs ? (have ? `${have} pcs here` : 'none here') : (m.code ? 'Art. ' + esc(m.code) : '&nbsp;')}</small></button>`;
}
VIEWS.materials = () => {
  const u = usage();
  const all = L.materials.filter(m => m.brand === cur.brand && inSys(m, cur.system));
  const q = cur.q.trim().toLowerCase();
  const match = m => !q || (m.name + ' ' + (m.code || '')).toLowerCase().includes(q);
  const fs = fromStock();
  let listHtml = '';
  if (q) {
    const hits = all.filter(match).sort(byName);
    listHtml = hits.length ? `<div class="mtiles">${hits.map(m => tile({type:'mat', m, name:m.name})).join('')}</div>` : `<div class="empty">No material matches “${esc(cur.q)}”.</div>`;
  } else if (!all.length) {
    listHtml = `<div class="empty">${dbReady ? 'No materials listed for this brand and type yet. The admin can add them with photos. You can still add a material by name below.' : (dbMissing ? 'Add materials by name below.' : 'Loading materials…')}</div>`;
  } else {
    const entries = materialGroups(all).sort(tileOrder);
    if (fs) {
      const here = materialGroups(all.filter(m => (fs[m.id] || 0) > 0), false).map(h => h.type === 'group' ? entries.find(e => e.type === 'group' && e.key === h.key) || h : entries.find(e => e.type === 'mat' && e.m.id === h.m.id) || h).sort(tileOrder);
      listHtml += `<h3 class="sec">On ${esc(D.from.name)} <small>${here.length ? 'only what is on site' : ''}</small></h3>`;
      listHtml += here.length ? `<div class="mtiles">${here.map(e => tile(e, true)).join('')}</div>` : `<div class="empty">No ${esc(brandName(cur.brand))} ${esc(sysName(cur.system).toLowerCase())} material on ${esc(D.from.name)}.</div>`;
    }
    listHtml += `<h3 class="sec">All materials <small>${entries.length} types</small></h3><div class="mtiles">${entries.map(e => tile(e, false)).join('')}</div>`;
  }
  return `<main class="wrap">
    <p class="eyebrow">${esc(brandName(cur.brand))} · ${esc(sysName(cur.system))}</p>
    <h2>Tap a material to add it</h2>
    ${all.length > 6 ? `<div class="search"><input class="in" id="m-q" data-f="m-q" type="search" placeholder="Search material, size or article no." value="${esc(cur.q)}"></div>` : ''}
    ${listHtml}
    <div style="margin-top:14px"><button class="btn ghost" data-a="other">Material not in the list</button></div>
  </main>${footer(`<div class="meta"><b>${D.items.length} items</b>${totalPcs()} pcs on truck</div><button class="btn" data-a="go" data-v="review" ${D.items.length ? '' : 'disabled'}>Finish loading</button>`)}`;
};
function groupRow(g){
  const fs = fromStock();
  const inList = g.members.map(x => D.items.find(i => i.matId === x.m.id)).filter(Boolean);
  const pcs = inList.reduce((a, i) => a + i.qty, 0);
  const avail = fs ? g.members.filter(x => (fs[x.m.id] || 0) > 0).length : null;
  return `<button class="mat grp" data-a="open-group" data-id="${esc(g.key)}">${thumb(g.photo || (g.members[0] || {}).m)}
    <span class="t"><b>${esc(g.name)}</b><small>${g.members.length} ${g.named ? 'models' : 'sizes'}${fs ? ` · ${avail ? `${avail} available on ${esc(D.from.name)}` : `<span class="neg">none on ${esc(D.from.name)}</span>`}` : ''}${inList.length ? ` · ${inList.length} in list` : ''}</small></span>
    ${pcs ? `<span class="badge">${pcs} pcs</span>` : `<span class="chev">›</span>`}</button>`;
}
/* one model with several lengths: a quantity box for each */
VIEWS.model = () => {
  const all = L.materials.filter(m => m.brand === cur.brand && inSys(m, cur.system) && m.model === cur.model);
  if (!all.length) return VIEWS.materials();
  all.sort((a, b) => bySize({size:a.variant || a.name}, {size:b.variant || b.name}));
  const fs = fromStock();
  cur.vq = cur.vq || {};
  const pm = all.find(m => m.photo) || all[0];
  const rows = all.map(m => {
    const inCart = D.items.find(i => i.matId === m.id);
    const val = cur.vq[m.id] ?? (inCart ? inCart.qty : '');
    const have = fs ? Math.max(0, fs[m.id] || 0) : null;
    return `<label class="vrow ${fs && !have ? 'none' : ''}"><span><b>${esc(m.variant || m.name)}</b><small>${fs ? (have ? `${have} available on ${esc(D.from.name)}` : `none on ${esc(D.from.name)}`) : (m.code ? 'Art. ' + esc(m.code) : '&nbsp;')}</small></span>
      <input class="in vq" type="number" inputmode="numeric" min="0" ${fs ? `max="${have}"` : ''} placeholder="0" data-f="vq" data-id="${esc(m.id)}" value="${esc(String(val))}" aria-label="Quantity ${esc(m.name)}"></label>`;
  }).join('');
  return `<main class="wrap">
    <p class="eyebrow">${esc(brandName(cur.brand))} · ${esc(sysName(cur.system))}${cur.group ? ' · ' + esc(cur.group.replace(/^./, c => c.toUpperCase())) : ''}</p>
    <div class="ghead">${pm.photo ? `<button class="thumb zoomable-t" data-a="zoom-img" data-id="${esc(pm.id)}" aria-label="Zoom photo"><img src="${esc(pm.photo)}" alt=""></button>` : thumb(pm)}
      <div><h2 style="margin:0">${esc(cur.model)}</h2><p class="lead" style="margin:2px 0 0">Write the quantity for each length</p></div></div>
    <div class="vlist">${rows}</div>
    <p class="err" id="vq-err" hidden></p>
  </main>${footer(`<button class="btn ghost" data-a="back">Back</button><button class="btn" data-a="add-variants">Add to list</button>`)}`;
};
/* one product type: pick the size */
VIEWS.group = () => {
  const all = L.materials.filter(m => m.brand === cur.brand && inSys(m, cur.system));
  const g = materialGroups(all).find(e => e.type === 'group' && e.key === cur.group);
  if (!g) return VIEWS.materials();
  const fs = fromStock();
  const onlySite = !!(cur.groupSite && fs);
  const allCount = g.members.length, allMembers = g.members;
  if (onlySite) g.members = g.members.filter(x => (fs[x.m.id] || 0) > 0 || D.items.some(i => i.matId === x.m.id));
  const twoPart = g.members.every(x => /[\/x×]/.test(x.size) && sizeKey(x.size).length > 1) && g.members.length > 8;
  const pics = g.members.some(x => x.m.photo && (!g.photo || x.m.photo !== g.photo.photo));
  let lastHead = null, h = '', sh = '';
  const seenModel = new Set();
  const skOf = x => `${cur.brand}|${cur.system}|in:${g.key}|${x.m.model ? 'md:' + x.m.model : 'm:' + x.m.id}`;
  for (const x of g.members) {
    const sk = skOf(x), starred = starOn(sk);
    if (x.m.model) {
      if (seenModel.has(x.m.model)) continue; seenModel.add(x.m.model);
      const vs = g.members.filter(y => y.m.model === x.m.model);
      const pcsIn = vs.reduce((a, y) => a + ((D.items.find(i => i.matId === y.m.id) || {}).qty || 0), 0);
      const haveM = fs ? vs.reduce((a, y) => a + Math.max(0, fs[y.m.id] || 0), 0) : null;
      const own = x.m.photo && (!g.photo || x.m.photo !== g.photo.photo) ? x.m.photo : '';
      const mb = `<button class="size ${own ? 'withpic' : ''} ${pcsIn ? 'on' : ''} ${fs && !haveM ? 'none' : ''}" data-a="open-model" data-id="${esc(x.m.model)}">
        ${starSpan(sk)}${own ? `<img src="${esc(own)}" alt="">` : ''}<b>${esc(x.m.model)}</b><small>${pcsIn ? `${pcsIn} pcs in list` : `${vs.map(y => esc(y.m.variant || y.size)).join(' · ')}`}</small></button>`;
      if (starred) sh += mb; else h += mb;
      continue;
    }
    if (twoPart && !starred) { const head = sizeKey(x.size)[0]; if (head !== lastHead) { if (lastHead !== null) h += '</div>'; h += `<div class="az">${esc(g.name)} ${esc(String(head))}/…</div><div class="sizes">`; lastHead = head; } }
    const inCart = D.items.find(i => i.matId === x.m.id);
    const have = fs ? Math.max(0, fs[x.m.id] || 0) : null;
    const own = x.m.photo && (!g.photo || x.m.photo !== g.photo.photo) ? x.m.photo : '';
    const sb = `<button class="size ${own ? 'withpic' : ''} ${inCart ? 'on' : ''} ${fs && !have ? 'none' : ''}" data-a="mat" data-id="${esc(x.m.id)}">
      ${starSpan(sk)}${own ? `<img src="${esc(own)}" alt="">` : ''}<b>${esc(x.size)}</b><small>${inCart ? `${inCart.qty} pcs in list` : fs ? (have ? `${have} available${panelM2(x.m) ? ` · ${fmtM2(panelM2(x.m) * have)} m²` : ''}` : 'none on site') : (x.m.code ? 'Art. ' + esc(x.m.code) : (panelM2(x.m) ? fmtM2each(panelM2(x.m)) + ' m² each' : '&nbsp;'))}</small></button>`;
    if (starred) sh += sb; else h += sb;
  }
  if (twoPart && lastHead !== null) h += '</div>';
  const pm = g.photo || (g.members[0] || {}).m || {system:cur.system};
  return `<main class="wrap">
    <p class="eyebrow">${esc(brandName(cur.brand))} · ${esc(sysName(cur.system))}</p>
    <div class="ghead">${pm.photo ? `<button class="thumb zoomable-t" data-a="zoom-img" data-id="${esc(pm.id)}" ${pm.zoomGroup ? `data-group="${esc(g.name)}"` : ''} aria-label="Zoom photo">${`<img src="${esc(pm.photo)}" alt="">`}</button>` : thumb(pm)}
      <div><h2 style="margin:0">${esc(g.name)}</h2><p class="lead" style="margin:2px 0 0">${g.named ? `Choose the model · ${modelCount(g.members)} models` : `Choose the size · ${g.members.length} sizes`}${onlySite ? ` on ${esc(D.from.name)}` : ''}${(() => { const gm = fs ? g.members.reduce((a, x) => a + panelM2(x.m) * Math.max(0, fs[x.m.id] || 0), 0) : 0; return gm ? ` · <b>${fmtM2(gm)} m²</b> on ${esc(D.from.name)}` : ''; })()}</p></div></div>
    ${onlySite && allCount > g.members.length ? `<button class="linkbtn" data-a="group-all">Show all ${g.named ? modelCount(allMembers) : allCount} ${g.named ? 'models' : 'sizes'}</button>` : ''}
    ${!g.members.length ? `<div class="empty">Nothing in ${esc(g.name)} yet. The admin adds items under Admin → Materials, with Group “${esc(g.name)}”.</div>` : twoPart ? `${sh ? `<div class="az">★ Starred</div><div class="sizes">${sh}</div>` : ''}${h}` : `<div class="sizes ${pics ? 'pics' : ''}">${sh}${h}</div>`}
  </main>${footer(`<button class="btn ghost" data-a="back">All materials</button><button class="btn" data-a="go" data-v="review" ${D.items.length ? '' : 'disabled'}>Finish loading</button>`)}`;
};
function thumb(m, sys){ return `<span class="thumb">${m && m.photo ? `<img src="${esc(m.photo)}" alt="">` : I[(m && m.system) || sys || 'wall']}</span>`; }
function matRow(m, u){
  const inCart = D.items.find(i => i.matId === m.id);
  const fs = fromStock();
  const have = fs ? Math.max(0, fs[m.id] || 0) : null;
  const onSite = fs ? (have ? `available on ${esc(D.from.name)}: ${have} pcs` : `<span class="neg">none on ${esc(D.from.name)}</span>`) : (u[m.id] ? `used in ${u[m.id]} deliveries` : 'not used yet');
  return `<button class="mat" data-a="mat" data-id="${esc(m.id)}">${thumb(m)}
    <span class="t"><b>${esc(m.name)}${m.sample ? '<span class="tag">sample</span>' : ''}</b><small>${m.code ? 'Art. ' + esc(m.code) + ' · ' : ''}${onSite}</small></span>
    ${inCart ? `<span class="badge">${inCart.qty} pcs</span>` : '<span></span>'}</button>`;
}

/* step 9: quantity sheet */
function sheetHtml(){
  if (!sheet) return '';
  const m = sheet.mat;
  const existing = m ? D.items.find(i => i.matId === m.id) : null;
  const q = sheet.qty ?? (existing ? existing.qty : '');
  return `<div class="scrim" data-a="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Quantity">
    ${m ? `${(m.photos || []).length ? `<div class="gal"><div class="gal-track" id="gal">${[m.photo, ...m.photos].filter(Boolean).map((p, i) => `<button class="bigimg zoomable" data-a="zoom-img" data-id="${esc(m.id)}" data-i="${i}" aria-label="Photo ${i + 1} of ${esc(m.name)}, tap to zoom"><img src="${esc(p)}" alt=""><span class="zhint">${I.zoom} Tap to zoom</span></button>`).join('')}</div>
        <button class="gal-nav l" data-a="gal" data-d="-1" aria-label="Previous photo">${I.back}</button><button class="gal-nav r" data-a="gal" data-d="1" aria-label="Next photo">${I.back}</button>
        <div class="gal-dots">${[m.photo, ...m.photos].filter(Boolean).map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><p class="gal-hint">Swipe left or right · ${[m.photo, ...m.photos].filter(Boolean).length} photos</p></div>`
      : m.photo ? `<button class="bigimg zoomable" data-a="zoom-img" data-id="${esc(m.id)}" aria-label="Open photo of ${esc(m.name)} to zoom"><img src="${esc(m.photo)}" alt=""><span class="zhint">${I.zoom} Tap to zoom</span></button>` : `<div class="bigimg">${I[m.system]}</div>`}
      <p class="eyebrow">${esc(brandName(m.brand))} · ${esc(sysName(m.system))}${m.code ? ' · Art. ' + esc(m.code) : ''}</p>
      <h2 style="font-size:26px">${esc(m.name)}</h2>`
    : `<p class="eyebrow">${esc(brandName(cur.brand))} · ${esc(sysName(cur.system))}</p><h2 style="font-size:26px">Material not in the list</h2>
      <label class="f">Material name<input class="in" id="o-name" data-f="o-name" value="${esc(sheet.name || '')}" data-autofocus></label>`}
    ${m && fromStock() ? `<p class="hint">Available on ${esc(D.from.name)}: <b>${maxFor(m.id)} pcs</b>. You can't send more than this.</p>` : ''}
    <p class="err" id="qty-err" ${m && +q > maxFor(m.id) ? '' : 'hidden'}>Only ${m ? maxFor(m.id) : 0} pcs on ${esc(D.from.name)}.</p>
    <label class="f" for="qty" style="margin-top:12px">How many pieces?</label>
    <div class="qty"><button data-a="qty-step" data-d="-1" aria-label="One less">−</button>
      <input id="qty" data-f="qty" type="number" inputmode="numeric" min="1" step="1" ${m && maxFor(m.id) !== Infinity ? `max="${maxFor(m.id)}"` : ''} value="${esc(q)}" ${m ? 'data-autofocus' : ''}>
      <button data-a="qty-step" data-d="1" aria-label="One more">+</button></div>
    <div class="quick">${[10, 20, 50, 100].map(n => `<button data-a="qty-add" data-d="${n}">+${n}</button>`).join('')}</div>
    <div class="stack"><button class="btn" id="add" data-a="add-item" ${(+q > 0 && (m ? +q <= maxFor(m.id) : (sheet.name || '').trim())) ? '' : 'disabled'}>${existing ? 'Update delivery list' : 'Add to delivery list'}</button>
    ${existing ? `<button class="btn ghost" data-a="remove-item" data-id="${esc(existing.key)}">Remove from list</button>` : ''}
    <button class="btn ghost" data-a="close-sheet-btn">Cancel</button></div>
  </div></div>`;
}

/* step 11: review */
VIEWS.review = () => {
  const groups = {};
  D.items.forEach(i => { const k = brandName(i.brand) + ' · ' + sysName(i.system); (groups[k] = groups[k] || []).push(i); });
  return `<main class="wrap">
    <p class="eyebrow">${esc(draftLbl())}</p>
    <h2>Check the delivery list</h2>
    <p class="lead">Change quantities if needed, then confirm.</p>
    ${D.items.length ? Object.entries(groups).map(([g, items]) => `<h3>${esc(g)}</h3><div class="stack">${items.map(i => `
      <div class="item"><div class="t"><b>${esc(i.name)}</b>${i.code ? `<small>Art. ${esc(i.code)}</small>` : ''}<br><button class="linkbtn" data-a="remove-item" data-id="${esc(i.key)}">Remove</button></div>
      <div class="stepper"><button data-a="inc" data-id="${esc(i.key)}" data-d="-1" aria-label="One less">−</button><output>${i.qty}</output><button data-a="inc" data-id="${esc(i.key)}" data-d="1" aria-label="One more">+</button></div></div>`).join('')}</div>`).join('')
      : `<div class="empty">No materials yet.</div>`}
    <div class="total"><span>Total</span><span>${D.items.length} items · ${totalPcs()} pcs</span></div>
    <div style="margin-top:16px"><button class="btn ghost" data-a="go" data-v="brand">Add more materials</button></div>
    ${overStock(toRecord(D, 'pdf')).length ? `<div class="banner bad" style="margin-top:14px"><b>More than ${esc(D.from.name)} has:</b>${overStock(toRecord(D, 'pdf')).map(i => `<br>${esc(i.name)}: ${i.qty} on the list, ${i.have} available`).join('')}<br>Lower the quantities to continue.</div>` : ''}
  </main>${isIncoming(D)
    ? footer(`<button class="btn" data-a="confirm-send" ${D.items.length ? '' : 'disabled'}>${me && D.to && isMySite(D.to.id) ? 'Save and count now' : `Send to ${esc(D.to.name)}`}</button>`)
    : footer(nextBtn(D.items.length && !overStock(toRecord(D, 'pdf')).length, 'Confirm materials'))}`;
};

/* step 12: photos */
VIEWS.photos = () => {
  const n = D.photos.length;
  return `<main class="wrap">
    <p class="eyebrow">${esc(draftLbl())}</p>
    <h2>${isIncoming(D) ? 'Photos (optional)' : 'Photos of the loaded truck'}</h2>
    <p class="lead">${isIncoming(D) ? `Last step. You can add a photo of the supplier's paper delivery note. ${me && D.to && isMySite(D.to.id) ? 'Then count the material: your acceptance confirms the delivery note.' : `${esc(D.to.name)}'s site manager counts the material on arrival, and their acceptance confirms the delivery note.`}` : 'Take at least 2 photos: the load and the plate.'}</p>
    <div class="photos">
      ${D.photos.map((p, i) => `<div class="ph"><img src="${p.pdf.url}" alt="Truck photo ${i+1}"><span class="n">${i+1}</span><button data-a="rm-photo" data-i="${i}" aria-label="Delete photo ${i+1}">×</button></div>`).join('')}
      ${n < 6 ? `<label class="camera">${I.cam}<span>Take photo</span><input type="file" accept="image/*" capture="environment" data-f="photo"></label>` : ''}
    </div>
    ${isIncoming(D) ? '' : `<p class="count ${n >= 2 ? 'ok' : ''}">${n} of 2 required photos${n >= 2 ? ' ✓' : ''}</p>`}
    <label class="filebtn">Choose from gallery<input type="file" accept="image/*" multiple data-f="photo"></label>
  </main>${isIncoming(D)
    ? footer(`<button class="btn" data-a="confirm-send">${me && D.to && isMySite(D.to.id) ? 'Save and count now' : `Send to ${esc(D.to.name)}`}</button>`)
    : footer(nextBtn(n >= 2))}`;
};

/* step 13: send — submit (manager) or confirm (admin), then follow the approval */
VIEWS.send = () => {
  const rec = toRecord(D, 'pdf');
  const direct = isAdmin || !needsApproval(rec) || !db;
  if (!D.saved && isIncoming(D)) return `<main class="wrap">
    <h2>Send to ${esc(D.to.name)} for checking</h2>
    <p class="lead">The site manager of ${esc(D.to.name)} gets this in the app, counts each material on arrival, and approves it. Only then is it added to the site's stock.</p>
    ${noteCard(rec)}
    <div class="share"><button class="btn" data-a="confirm-send">Send to site for checking</button></div></main>`;
  if (!D.saved) return `<main class="wrap">
    <h2>${direct ? 'Confirm the delivery' : 'Send for approval'}</h2>
    <p class="lead">${direct ? (isAdmin ? 'Confirming saves the delivery, updates site stock and creates the PDF.' : 'Returns to an owner warehouse need no approval. Confirming takes the pieces off the site stock and creates the PDF.') : 'Deliveries from one site to another need admin approval before the truck leaves. Site stock changes after approval.'}</p>
    ${noteCard(rec)}${negWarn(rec)}${sigBlock(rec, 'pre')}
    <div class="share"><button class="btn" data-a="confirm-send" ${db && !sigsReady(rec.id) ? 'disabled' : ''}>${direct ? I.pdf + ' Confirm & create PDF' : 'Send for approval'}</button>
    ${db && !sigsReady(rec.id) ? '<p class="hint">The site manager and the driver must sign first.</p>' : ''}</div>
  </main>`;
  return `<main class="wrap">${statusBlock(rec)}</main>${footer(`<button class="btn dark" data-a="finish">Done · new delivery</button>`)}`;
};
VIEWS.detail = () => detail ? `<main class="wrap">${statusBlock(detail)}
  ${isAdmin ? `<div style="margin-top:22px"><button class="del ${armed === 'dl:' + detail.id ? 'arm' : ''}" data-a="del" data-k="deliveries" data-id="${esc(detail.id)}">${armed === 'dl:' + detail.id ? 'Tap again to delete this delivery' : 'Delete delivery'}</button></div>` : ''}</main>` : VIEWS.home();

/* receiving side: check every material, sign, then print or save */
const recvSigned = rec => !!((sigCache[rec.id] || {}).receiver);
const recvReady = rec => !!L.receipts[rec.id] && recvSigned(rec);
const isReceiverSide = rec => !!db && !!rec.to && rec.to.kind === 'site' && (isIncoming(rec) || (!!me && !isMine(rec) && (isAdmin || isMySite(rec.to.id))));
function recvSigRow(rec, enabled){
  if (!(rec.id in sigCache)) { loadSigs(rec.id); return '<div class="empty">Loading signatures…</div>'; }

/* print / save on the receiving side only after the check is saved and signed */
function recvGate(rec, printBlock){
  if (!isReceiverSide(rec)) return printBlock;

  if (recvReady(rec)) return printBlock;
  if (!L.receipts[rec.id]) return `<div class="banner"><b>Print and save open after the check.</b> Check every material that arrived, then sign.</div>`;

/* ---------- serial numbers: one locked counter for the whole app, starting at 10001 ---------- */
async function nextSerial(){
  const ref = db.doc('counters/notes'); const holder = 'h' + Math.random().toString(36).slice(2);
  for (let i = 0; i < 25; i++) {
    let r = {acquired:true};
    try { r = await ref.acquire({holder, ttlMs:8000}); } catch(_) {}
    if (r.acquired) {
      const snap = await ref.get();
      const last = Math.max(10000, snap.exists ? (+snap.data().last || 10000) : 10000, ...L.deliveries.map(d => +d.serial || 0));
      const n = last + 1;
      await ref.set({last:n, updatedAt:Date.now()});
      return n;
    }
    await new Promise(res => setTimeout(res, 250 + Math.random() * 600));
  }
  throw new Error('counter busy');
}
let backfilling = false;
async function backfillSerials(){
  if (backfilling || !db || !isAdmin) return;
  const todo = L.deliveries.filter(d => !d.serial).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!todo.length) return;
  backfilling = true;
  try { for (const d of todo) { const n = await nextSerial(); const {id, ...rest} = d; await db.collection('deliveries').doc(d.id).set({...rest, serial:n, no:'No. ' + n}); } }
  catch(_) {} finally { backfilling = false; }
}

async function saveReceipt(btn){
  const d = detail; if (!d || !db) return;
  if (!recvSigned(d)) { toast('Sign first to confirm the check.'); return; }
  const items = (d.items || []).map(i => { const m = recv.marks[i.key] || {}; return {key:i.key, matId:i.matId || null, name:i.name, brand:i.brand, sent:+i.qty, received:m.ok ? +i.qty : Math.max(0, parseInt(m.qty) || 0)}; });
  btn.disabled = true;
  const prev = L.receipts[d.id] || {};
  const doc = {by:(me && me.id) || null, at:Date.now(), items, resolve:prev.resolve || {}, photos:recv.photos.slice(0, 3)};
  while (JSON.stringify(doc).length > 240000 && doc.photos.length) doc.photos.pop();
  try { await db.collection('receipts').doc(d.id).set(doc); L.receipts = {...L.receipts, [d.id]:doc};

  catch(e) { toast('Could not save. Check your connection.'); btn.disabled = false; }
}

async function resolveLost(el){

async function saveStock(btn){
  if (!db) return;
  const cur0 = {...((L.stock.find(x => x.id === folder.id) || {}).items || {})};
  app.querySelectorAll('input.os').forEach(i => { const v = parseInt(i.value); if (v > 0) cur0[i.dataset.mat] = v; else delete cur0[i.dataset.mat]; });
  btn.disabled = true;
  const old = (L.stock.find(x => x.id === folder.id) || {}).items || {};
  const changes = {}; new Set([...Object.keys(old), ...Object.keys(cur0)]).forEach(m => { if ((old[m] || 0) !== (cur0[m] || 0)) changes[m] = {from:old[m] || 0, to:cur0[m] || 0}; });
  try {
    const hasLog = L.stocklog.some(x => x.siteId === folder.id);
    if (!hasLog && Object.keys(old).length) {   // stock entered before history existed: record it once as the initial stock
      const init = {}; Object.entries(old).forEach(([m, q]) => init[m] = {from:0, to:q});
      await db.collection('stocklog').add({siteId:folder.id, at:(L.stock.find(x => x.id === folder.id) || {}).updatedAt || Date.now() - 1, by:null, initial:true, changes:init});
    }
    if (Object.keys(changes).length) await db.collection('stocklog').add({siteId:folder.id, at:Date.now(), by:(me && me.id) || null, initial:!hasLog && !Object.keys(old).length, changes});
    await db.doc('catalog/main/stock/' + folder.id).set({items:cur0, updatedAt:Date.now()}); toast('Starting stock saved'); stockEdit = false; dirty = false; render(); }
  catch(e) { toast('Could not save. Only the admin can set stock.'); btn.disabled = false; }
}

/* ---------- approval ---------- */
async function writeDecision(rec, status, reason, auto){
  const doc = {status, type:rec.type || null, by:(me && me.id) || null, byAdmin:isAdmin, auto:!!auto, at:Date.now(), reason:reason || '',
    from:{kind:rec.fromKind || null, id:rec.fromId || null}, to:{kind:rec.to.kind || null, id:rec.to.id || null},
    items:(rec.items || []).filter(i => i.matId).map(i => ({matId:i.matId, qty:+i.qty}))};
  await db.collection('approvals').doc(rec.id).set(doc);
  L.apMap = {...L.apMap, [rec.id]:doc};
}
async function decide(btn, status){
  if (!db || !isAdmin) return;
  const rec = view === 'detail' ? detail : toRecord(D, 'small');
  const reason = ($('#rej-reason') || {}).value || '';
  if (status === 'approved') { const over = overStock(rec); if (over.length) { toast(`Can't approve: ${over[0].name} needs ${over[0].qty} pcs, ${rec.from} has ${over[0].have}. Cancel it with a reason.`); return; } }
  if (status === 'rejected' && !reason.trim()) { toast('Write a reason so the site manager knows what to fix.'); $('#rej-reason').focus(); return; }
  btn.disabled = true;
  try { await writeDecision(rec, status, reason.trim()); toast(status === 'approved' ? `Approved ${rec.no} · stock updated` : `Cancelled ${rec.no}`); if (detailFrom === 'notif') go('notif'); }
  catch(e) { toast('Could not save the decision.'); btn.disabled = false; }
}

function summaryText(r){
  const pcs = (r.items || []).reduce((s, i) => s + (+i.qty || 0), 0);
  return `Formwork delivery ${r.no}\nDate: ${fmtDate(r.createdAt)}\nSent by: ${r.person}\nFrom: ${r.from}\nTo: ${[r.to.name, r.to.address].filter(Boolean).join(' - ')}\nTruck: ${r.company} / ${r.driver} / ${r.plate}\n\nMaterials:\n` +
    (r.items || []).map(i => `- ${i.qty} pcs ${brandName(i.brand)} ${i.name}`).join('\n') + `\nTotal: ${pcs} pcs\n\nDelivery note PDF attached.`;
}
const summaryTr = r => summaryText(r).split('\n').map(tr).join('\n');
const waHref = (r, num) => `https://wa.me/${(num || '').replace(/\D/g, '')}?text=${encodeURIComponent(summaryTr(r))}`;
const mailHref = (r, to) => `mailto:${encodeURIComponent((to || '').trim()).replace(/%2C/g, ',').replace(/%40/g, '@')}?subject=${encodeURIComponent(tr('Formwork delivery') + ' ' + r.no + ' — ' + r.from + ' → ' + (r.to.name || r.to.address))}&body=${encodeURIComponent(summaryTr(r))}`;

function toRecord(d, which){
  return {id:d.id, no:d.no, createdAt:d.createdAt, person:d.person.name.trim(), personId:d.person.id, from:d.from.name.trim(), fromId:d.from.id, fromKind:d.from.kind || null,

    items:d.items.map(i => ({key:i.key, matId:i.matId || null, brand:i.brand, system:i.system, name:i.name, code:i.code || '', qty:+i.qty})),
    photos:d.photos.map(p => p[which]), by:(me && me.id) || null, loadStart:d.loadStart || null, loadEnd:d.loadEnd || null,
    serial:d.serial || null, type:d.type || null, extNo:(d.extNo || '').trim(), notePageCount:(d.notePages || []).length || d.notePageCount || 0};
}

        <p class="hint">Leave the group empty for sized products like "Panel 270/90": they group by name automatically.</p>

      <div class="stack">${list.map(m => `<div class="arow">${thumb(m)}<span class="t"><b>${esc(m.name)}${m.sample ? '<span class="tag">sample</span>' : ''}</b><small>${m.code ? 'Art. ' + esc(m.code) : ''}</small></span>
        <label class="filebtn">Photo<input type="file" accept="image/*" data-f="mat-photo" data-id="${esc(m.id)}"></label>${del('materials', m.id)}</div>`).join('') || '<div class="empty">No materials for this brand and type yet.</div>'}</div>`;
  }
  if (adminTab === 'houses') h += housesAdmin();
  if (adminTab === 'settings') {
    const s = L.settings || {};
    h += `<form class="form" data-form="settings"><p class="eyebrow">Shown on the PDF and used when sending</p>
      <label class="f">Company name on PDF<input class="in" id="st-c" value="${esc(s.company || '')}"></label>
      <label class="f">Default email(s), comma separated<input class="in" id="st-e" value="${esc(s.emails || '')}"></label>
      <label class="f">Default WhatsApp number<input class="in" id="st-w" inputmode="tel" value="${esc(s.whatsapp || '')}" placeholder="+355…"></label>
      <label class="f">Zagreb office phone (on order PDFs)<input class="in" id="st-z" inputmode="tel" value="${esc(s.zagrebPhone || '')}" placeholder="+385 1 …"></label>
      <label class="f">Admin WhatsApp for approval requests<input class="in" id="st-aw" inputmode="tel" value="${esc(s.adminWhatsapp || '')}" placeholder="+355…"></label>
      <button class="btn">Save</button></form>`;
  }
  return h + `</main>`;
};

/* ===================== TOOLS: inventory, handovers, service, transfers ===================== */
const TS = {available:'Available', in_use:'In Use', service_required:'Service Required', sent_for_repair:'Sent for Repair', under_repair:'Under Repair', repaired:'Repaired', back_in_service:'Back in Service', out_of_service:'Out of Service / Written Off', lost:'Lost'};
const TS_CLS = {available:'ok', in_use:'use', service_required:'svc', sent_for_repair:'svc', under_repair:'svc', repaired:'rep', back_in_service:'ok', out_of_service:'out', lost:'out'};
const SVC_OPEN = ['service_required', 'sent_for_repair', 'under_repair', 'repaired'];
const isBrig = () => !!me && me.role === 'brigadier';
const roleName = r => r === 'admin' ? 'Admin' : r === 'brigadier' ? 'Brigadier' : r === 'procurement' ? 'Procurement' : r === 'finance' ? 'Finance' : r === 'hr' ? 'Human Resources' : r === 'director' ? 'Company Director' : r === 'store' ? 'Main store' : 'Site manager';
const pById = id => L.people.find(p => p.id === id);
const pSites = p => !p ? [] : (Array.isArray(p.siteIds) && p.siteIds.length ? p.siteIds : (p.siteId ? [p.siteId] : []));
const managersOf = sid => L.people.filter(p => p.role === 'manager' && pSites(p).includes(sid)).sort(byName);
const brigsOf = sid => L.people.filter(p => p.role === 'brigadier' && pSites(p).includes(sid)).sort(byName);
const siteNm = sid => sid ? ((L.sites.find(x => x.id === sid) || {}).name || 'Removed site') : 'Main store';
const tKey = sid => sid || 'store';
const tSid = k => k === 'store' || !k ? null : k;
const toolScope = () => isAdmin ? [null, ...[...L.sites].sort(byName).map(s => s.id)] : mySiteIds();
const inToolScope = t => isAdmin || (!isBrig() && !!t.siteId && isMySite(t.siteId)) || (isBrig() && t.holderId === me.id);
const holderLine = t => t.holderId ? `${t.holderName || personName(pById(t.holderId) || {})} – ${roleName(t.holderRole)}` : 'Main store (admin)';
const tPill = s => `<span class="tst ts-${TS_CLS[s] || 'ok'}">${esc(TS[s] || s)}</span>`;
const nTools = n => `${n} ${n === 1 ? 'tool' : 'tools'}`;
const fmtDay = t => t ? new Date(t).toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
function busyTools(){
  const s = new Map();
  L.handovers.filter(h => h.status === 'open').forEach(h => (h.toolIds || []).forEach(id => s.set(id, 'Handover waiting for signatures')));
  L.transfers.filter(x => x.status === 'pending').forEach(x => (x.toolIds || []).forEach(id => s.set(id, 'Transfer waiting for approval')));
  return s;
}
const TPREV = {}, tevFull = {};
function tgo(v){ if (v !== view) TPREV[v] = view; go(v); }
const tcol = n => db.collection(n);
async function tEvent(toolId, type, extra){ await tcol('toolevents').add({toolId, type, at:Date.now(), by:me.id, byName:personName(me) || 'Admin', ...extra}); }
async function tNote(to, title, text, toolId){
  const list = [...new Set(to.filter(x => x && x !== me.id))]; if (!list.length) return;
  await tcol('tnotes').add({to:list, title, text, toolId:toolId || null, at:Date.now(), readBy:{}});
}
const thumbT = t => `<span class="thumb">${t && t.photo ? `<img src="${esc(t.photo)}" alt="">` : I.tool}</span>`;
function toolRow(t, busy){
  const b = (busy || busyTools()).get(t.id);
  return `<button class="arow trow" data-a="t-open" data-id="${esc(t.id)}">${thumbT(t)}<span class="t"><b>${esc(t.name)}</b>
    <small>${esc([t.brand, t.serial ? 'SN ' + t.serial : ''].filter(Boolean).join(' · '))}</small>
    ${(t.kit || []).length ? `<small class="kitl">Set: <span>${esc(kitLine(t))}</span></small>` : ''}<small class="hold">${esc(holderLine(t))}</small>${b ? `<small class="busy">${esc(b)}</small>` : ''}</span>${tPill(t.status)}</button>`;
}
const kitParts = t => (t && t.kit || []).map(id => L.tools.find(x => x.id === id)).filter(Boolean);
const kitLine = t => kitParts(t).map(k => `${k.name}${k.serial ? ' (SN ' + k.serial + ')' : ''}`).join(' + ');
const kitSnap = t => kitParts(t).map(k => ({id:k.id, name:k.name, serial:k.serial || ''}));
function toolCounts(list){
  list = list.filter(t => !t.kitOf);
  return {all:list.filter(t => !['out_of_service'].includes(t.status)).length, use:list.filter(t => t.status === 'in_use').length,
    avail:list.filter(t => t.status === 'available').length, svc:list.filter(t => SVC_OPEN.includes(t.status)).length, lost:list.filter(t => t.status === 'lost').length};
}

/* Tools home: one folder per site (admins also see the main store) */
VIEWS.tools = () => {
  if (isBrig()) return VIEWS.mytools();
  const scope = toolScope(), busy = busyTools();
  const rows = scope.map(sid => { const c = toolCounts(L.tools.filter(t => (t.siteId || null) === sid));
    return `<button class="folder" data-a="t-site" data-id="${esc(tKey(sid))}"><span class="fi tl">${I.tool}</span><span class="t"><b>${esc(siteNm(sid))}</b>
      <small>${nTools(c.all)} · ${c.use} in use · ${c.avail} available${c.svc ? ` · ${c.svc} need service` : ''}</small></span>${c.svc ? `<span class="badge neg-b">${c.svc}</span>` : '<span class="chev">›</span>'}</button>`; }).join('');
  const att = L.tools.filter(t => !t.kitOf && inToolScope(t) && (SVC_OPEN.includes(t.status) || t.status === 'lost')).sort((a, b) => (b.since || 0) - (a.since || 0));
  const hos = L.handovers.filter(h => h.status === 'open' && (isAdmin || (h.siteId && isMySite(h.siteId))));
  const trs = L.transfers.filter(x => x.status === 'pending' && (isAdmin || isMySite(x.fromSiteId) || isMySite(x.toSiteId)));
  return `<main class="wrap"><h2>Tools</h2><p class="lead">Every tool, where it is, who is responsible for it and whether it works.</p>
    ${isAdmin ? `<div class="stack" style="margin-bottom:14px"><button class="main m3" data-a="t-add"><span class="mi">${I.tool}</span><span class="mt"><b>Add a new tool</b><small>Photo, brand, description and serial number. New tools go to the main store.</small></span></button></div>` : ''}
    ${hos.length ? `<h3 class="sec">Waiting for signatures <small>${hos.length}</small></h3><div class="stack">${hos.map(hoRow).join('')}</div>` : ''}
    ${trs.length ? `<h3 class="sec">Transfers waiting for approval <small>${trs.length}</small></h3><div class="stack">${trs.map(trRow).join('')}</div>` : ''}
    <h3 class="sec">${isAdmin ? 'Sites' : 'Your sites'} <small>${scope.length}</small></h3>
    <div class="stack">${rows || '<div class="empty">You are not linked to a site. Ask an admin.</div>'}</div>
    ${att.length ? `<h3 class="sec">Needs attention <small>${att.length}</small></h3><div class="stack">${att.map(t => toolRow(t, busy)).join('')}</div>` : ''}
  </main>`;
};
const hoKindLbl = h => ({to_manager:'Admin → Site manager', to_brigadier:'Site manager → Brigadier', return:'Brigadier → Site manager', to_store:'Site manager → Main store'})[h.kind] || '';
const hoRow = h => `<button class="opt" data-a="t-open-ho" data-id="${esc(h.id)}"><span class="t"><b>${esc(h.no)} · <span>${esc(hoKindLbl(h))}</span></b><small>${esc(h.fromName)} → ${esc(h.toName)} · <span>${nTools((h.toolIds || []).length)}</span> · <span>${esc(siteNm(h.siteId))}</span></small></span><span class="chev">›</span></button>`;
const trRow = x => `<button class="opt" data-a="t-open-tr" data-id="${esc(x.id)}"><span class="t"><b>${esc(x.fromSiteName)} → ${esc(x.toSiteName)}</b><small><span>${nTools((x.toolIds || []).length)}</span> · <span>requested by ${esc(x.requestedByName)}</span> · <span>${esc(fmtDate(x.at))}</span></small></span><span class="st st-pending">Waiting</span></button>`;

/* one site's tool inventory */
VIEWS.toolsite = () => {
  const sid = tSid(cur.tsite);
  if (!isAdmin && !(sid && isMySite(sid))) return VIEWS.tools();
  const all = L.tools.filter(t => !t.kitOf && (t.siteId || null) === sid), c = toolCounts(all), busy = busyTools();
  const f = cur.tf || 'all';
  const pass = t => f === 'all' ? t.status !== 'out_of_service' : f === 'use' ? t.status === 'in_use' : f === 'avail' ? t.status === 'available' : f === 'svc' ? SVC_OPEN.includes(t.status) : ['out_of_service', 'lost'].includes(t.status);
  const list = all.filter(pass).sort((a, b) => byName(a, b));
  const q = (cur.tq || '').toLowerCase().trim();
  const shown = q ? list.filter(t => [t.name, t.brand, t.serial, t.holderName, t.description, kitLine(t)].some(v => (v || '').toLowerCase().includes(q))) : list;
  const chip = (k, n, lbl) => `<button class="${f === k ? 'on' : ''}" data-a="t-filter" data-id="${k}">${lbl}<br><b>${n}</b></button>`;
  const acts = sid ? [
    ['to_brigadier', 'Issue to a brigadier', 'The brigadier signs and becomes responsible'],
    ['return', 'Return from a brigadier', 'The brigadier gives tools back to the site manager'],
    ['transfer', 'Transfer to another site', isAdmin ? 'Move tools to another site' : 'Needs admin approval'],
    ['to_store', 'Return to the main store', 'Site manager gives tools back to the admin'],
  ] : [['to_manager', 'Hand over to a site manager', 'The site manager signs and becomes responsible for the tools']];
  return `<main class="wrap"><p class="eyebrow">Tools</p><h2>${esc(siteNm(sid))}</h2>
    <div class="seg five">${chip('all', c.all, 'All')}${chip('use', c.use, 'In use')}${chip('avail', c.avail, 'Available')}${chip('svc', c.svc, 'Service')}${chip('out', all.filter(t => ['out_of_service', 'lost'].includes(t.status)).length, 'Out / lost')}</div>
    <div class="tacts">${!sid && isAdmin ? `<button class="tact" data-a="t-add"><b>+ Add a new tool</b><small>Goes to the main store</small></button>` : ''}${acts.map(([k, t, s]) => `<button class="tact" data-a="${k === 'transfer' ? 't-transfer' : 't-ho-new'}" data-id="${k}"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
    <input class="in" type="search" id="t-q" data-tq placeholder="Search tool, serial number or person" value="${esc(cur.tq || '')}" style="margin:12px 0">
    ${shown.length ? `<div class="stack">${shown.map(t => toolRow(t, busy)).join('')}</div>` : `<div class="empty">${all.length ? 'No tools match.' : (sid ? 'No tools on this site yet. The admin hands tools over to the site manager from the main store.' : 'No tools in the main store. Add a new tool.')}</div>`}
  </main>`;
};

/* one tool: where it is, who has it, status and its whole history */
VIEWS.tool = () => {
  const t = L.tools.find(x => x.id === cur.tool);
  if (!t) return `<main class="wrap"><div class="empty">${dbReady ? 'This tool was not found.' : 'Loading…'}</div></main>`;
  if (!inToolScope(t) && !(isBrig() && L.tevents.some(e => e.toolId === t.id))) return `<main class="wrap"><div class="empty">This tool is not on your sites.</div></main>`;
  const svcs = L.services.filter(s => s.toolId === t.id).sort((a, b) => b.at - a.at);
  const open = svcs.find(s => !s.closedAt);
  const hos = L.handovers.filter(h => h.status === 'done' && (h.toolIds || []).includes(t.id)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const trs = L.transfers.filter(x => (x.toolIds || []).includes(t.id)).sort((a, b) => b.at - a.at);
  if (!tevFull[t.id]) { tevFull[t.id] = 'loading'; db.collection('toolevents').where('toolId', '==', t.id).get().then(sn => { tevFull[t.id] = sn.docs.map(x => ({id:x.id, ...x.data()})).filter(e => e.toolId === t.id); refresh(); }).catch(() => { tevFull[t.id] = []; }); }
  const evMap = {}; [...(Array.isArray(tevFull[t.id]) ? tevFull[t.id] : []), ...L.tevents.filter(e => e.toolId === t.id)].forEach(e => evMap[e.id || (e.type + e.at)] = e);
  const evs = Object.values(evMap).sort((a, b) => b.at - a.at);
  const busy = busyTools().get(t.id);
  const mgr = !isBrig() && (isAdmin || (t.siteId && isMySite(t.siteId)));
  const repairs = svcs.filter(s => s.outcome === 'repaired').length;
  const fact = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  let acts = '';
  if (isBrig() && t.holderId === me.id && !open && ['in_use', 'available'].includes(t.status)) acts += `<button class="btn" data-a="t-report" data-id="${esc(t.id)}">${I.tool} Report for Service</button>`;
  if (mgr) {
    if (!open && !['out_of_service', 'lost'].includes(t.status)) acts += `<button class="btn ghost" data-a="t-report" data-id="${esc(t.id)}">Report for Service</button>`;
    if (open) {
      const nexts = SVC_OPEN.slice(SVC_OPEN.indexOf(t.status) + 1);
      acts += `<div class="svcbox"><p class="eyebrow">Update the service status</p><p class="hint" style="margin:0 0 8px">Now: <b>${esc(TS[t.status])}</b></p>
        <textarea class="in" id="t-svc-note" rows="2" placeholder="Note (optional): workshop, cost, what was fixed"></textarea>
        <div class="svbtns">${nexts.map(s => `<button class="btn sm dark" data-a="t-svc" data-v="${s}">${esc(TS[s])}</button>`).join('')}
        <button class="btn sm ok" data-a="t-svc" data-v="back_in_service">Back in Service</button>
        <button class="btn sm danger" data-a="t-svc" data-v="out_of_service">${armed === 'wo:' + t.id ? 'Tap again to write off' : 'Out of Service / Written Off'}</button></div></div>`;
    }
    if (!open && t.status !== 'out_of_service') acts += t.status === 'lost' ? `<button class="btn ghost" data-a="t-found" data-id="${esc(t.id)}">Tool found again</button>`
      : `<button class="btn ghost danger" data-a="t-lost" data-id="${esc(t.id)}">${armed === 'lost:' + t.id ? 'Tap again: mark as lost' : 'Mark as lost'}</button>`;
    if (!open && t.status === 'available') acts += '';
  }
  if (isAdmin) acts += `<button class="btn ghost" data-a="t-edit" data-id="${esc(t.id)}">Edit tool details</button>`;
  const evText = e => {
    const s = e.siteName ? [e.siteName] : [];
    if (e.type === 'added') return ['Added to the main store', [`by ${e.byName}`]];
    if (e.type === 'handover') return [`Handed over: ${e.fromName} → ${e.toName}`, [`${roleName(e.fromRole)} → ${roleName(e.toRole)}`, ...s, e.no || '']];
    if (e.type === 'return') return [`Returned: ${e.fromName} → ${e.toName}`, [`${roleName(e.fromRole)} → ${roleName(e.toRole)}`, ...s, e.no || '']];
    if (e.type === 'transfer_req') return [`Transfer requested: ${e.fromSiteName} → ${e.toSiteName}`, [`by ${e.byName}`]];
    if (e.type === 'transfer') return [`Transferred: ${e.fromSiteName} → ${e.toSiteName}`, [`Approved by ${e.byName}`, `responsible: ${e.toName}`]];
    if (e.type === 'transfer_rej') return [`Transfer cancelled: ${e.fromSiteName} → ${e.toSiteName}`, [`by ${e.byName}`, e.note || '']];
    if (e.type === 'service_report') return ['Reported for service', [`by ${e.byName}`, e.note || '']];
    if (e.type === 'service_status') return [`Service: ${TS[e.status] || e.status}`, [`by ${e.byName}`, e.note || '']];
    if (e.type === 'lost') return ['Marked as lost', [`by ${e.byName}`, `responsible at that time: ${e.holder}`]];
    if (e.type === 'found') return ['Found again', [`by ${e.byName}`]];
    if (e.type === 'edit') return ['Details changed', [`by ${e.byName}`]];
    if (e.type === 'kit_set') return ['Set put together', [`by ${e.byName}`, e.note || '']];
    if (e.type === 'kit_add') return [`Added to the set: ${e.note || ''}`, [`by ${e.byName}`]];
    if (e.type === 'kit_rm') return [`Removed from the set: ${e.note || ''}`, [`by ${e.byName}`]];
    return [e.type, [e.byName || '']];
  };
  return `<main class="wrap">
    <div class="tdet">${t.photo ? `<button class="tphoto" data-a="t-zoom" data-src="tool" data-id="${esc(t.id)}" aria-label="Zoom photo"><img src="${esc(t.photo)}" alt=""></button>` : `<span class="tphoto none">${I.tool}</span>`}
      <div><p class="eyebrow">${esc(t.brand || 'Tool')}</p><h2>${esc(t.name)}</h2>${tPill(t.status)}${busy ? ` <span class="tag">${esc(busy)}</span>` : ''}</div></div>
    ${t.description ? `<p class="lead" style="margin-top:10px">${esc(t.description)}</p>` : ''}
    <dl class="facts">
      ${fact('Tool', esc(t.name))}${fact('Serial number', `<span class="mono">${esc(t.serial || '—')}</span>`)}
      ${fact('Current site', esc(siteNm(t.siteId)))}
      ${fact('Responsible person', esc(holderLine(t)))}
      ${fact('Assigned', esc(fmtDay(t.since)))}
      ${fact('Status', tPill(t.status))}
      ${open ? fact('Problem', esc(open.problem)) + fact('Reported', `${esc(fmtDate(open.at))} · ${esc(open.reporterName)}`) : ''}
      ${hos[0] ? fact('Handover document', `<button class="lnk" data-a="t-pdf" data-id="${esc(hos[0].id)}">${I.pdf} View PDF</button>`) : ''}
      ${fact('Service history', `${svcs.length} ${svcs.length === 1 ? 'report' : 'reports'} · ${repairs} ${repairs === 1 ? 'repair' : 'repairs'}`)}
    </dl>
    ${t.kitOf ? (() => { const m = L.tools.find(x => x.id === t.kitOf); return `<div class="banner" style="margin-top:12px">This tool is part of a set. It moves together with the set in handovers and transfers. <button class="lnk" data-a="t-open" data-id="${esc(t.kitOf)}"><span>Open the set</span>${m ? ': <span>' + esc(m.name) + '</span>' : ''}</button></div>`; })() : ''}
    ${(t.kit || []).length || (isAdmin && !t.kitOf) ? `<h3 class="sec">Set contents <small>${kitParts(t).length}</small></h3>
      ${kitParts(t).length ? `<div class="stack">${kitParts(t).map(k => `<button class="arow trow" data-a="t-open" data-id="${esc(k.id)}">${thumbT(k)}<span class="t"><b>${esc(k.name)}</b><small>${esc([k.brand, k.serial ? 'SN ' + k.serial : ''].filter(Boolean).join(' · '))}</small></span>${tPill(k.status)}</button>`).join('')}</div>` : '<div class="empty">Single tool, not a set.</div>'}
      ${isAdmin ? `<button class="btn ghost sm" style="margin-top:10px" data-a="t-kit" data-id="${esc(t.id)}">Change set contents</button>` : ''}` : ''}
    ${acts && !t.kitOf ? `<div class="stack" style="margin-top:14px">${acts}</div>` : (t.kitOf && isAdmin ? `<div class="stack" style="margin-top:14px"><button class="btn ghost" data-a="t-edit" data-id="${esc(t.id)}">Edit tool details</button></div>` : '')}
    <h3 class="sec">Service and repair history <small>${svcs.length}</small></h3>
    ${svcs.length ? `<div class="stack">${svcs.map(svcCard).join('')}</div>` : '<div class="empty">Never reported for service.</div>'}
    <h3 class="sec">Handover documents <small>${hos.length}</small></h3>
    ${hos.length ? `<div class="stack">${hos.map(h => `<div class="arow"><span class="t"><b>${esc(h.no)} · ${esc(fmtDay(h.doneAt))}</b><small>${esc(h.fromName)} → ${esc(h.toName)} · <span>${esc(hoKindLbl(h))}</span></small></span><button class="btn sm ghost" data-a="t-pdf" data-id="${esc(h.id)}">PDF</button></div>`).join('')}</div>` : '<div class="empty">No signed handovers yet.</div>'}
    ${trs.length ? `<h3 class="sec">Site transfers <small>${trs.length}</small></h3><div class="stack">${trs.map(x => `<div class="arow"><span class="t"><b>${esc(x.fromSiteName)} → ${esc(x.toSiteName)}</b><small><span>${esc(fmtDate(x.decidedAt || x.at))}</span> · ${x.status === 'approved' ? `<span>approved by ${esc(x.decidedByName)}</span> · <span>responsible: ${esc(x.newHolderName)}</span>` : x.status === 'rejected' ? `<span>cancelled by ${esc(x.decidedByName)}</span>` : '<span>waiting for admin approval</span>'}</small></span></div>`).join('')}</div>` : ''}
    <h3 class="sec">Full history <small>${evs.length}</small></h3>
    ${evs.length ? `<div class="tline">${evs.map(e => { const [a, b] = evText(e); return `<div class="tev"><span class="when">${esc(fmtDate(e.at))}</span><b>${esc(a)}</b><small>${b.filter(Boolean).map(x => `<span>${esc(x)}</span>`).join(' · ')}</small></div>`; }).join('')}</div>` : '<div class="empty">No history yet.</div>'}
  </main>`;
};
function svcCard(s){

/* add or edit a tool (admin) */
